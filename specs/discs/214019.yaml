# One Shot, One Down — melody and harmony 2 are scripted. Harmony 1 comes from EffectIds.
# Stats: 18 Ignis DMG, 1 ATK.
melody:
  - {stat: 18, value: Param1, target: team, note: "Destiny Card bonus not modelled (0 cards)"}
harmony2:
  - {stat: 1, pct: true, value: Param1, target: team, note: "base"}
  - {stat: 1, pct: true, value: Param3, target: team, event: "timer:8", duration: inf, max_stacks: Param4,
     note: "+1 stack every 8 s after the battle begins, max 10"}
overrides:
  - {part: harmony1, stat: 18, event: "while:vul:2"}   # vs Ignis VUL = an Ignis DMG Taken debuff on the target
  - {part: harmony1, index: 1, drop: true}   # DMG taken reduction (defensive)
