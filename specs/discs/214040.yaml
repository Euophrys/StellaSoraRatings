# Fist of Courage — melody and harmony 2 are scripted. Harmony 1 comes from EffectIds.
# Stats: 58 Ult DMG, 56 Auto DMG.
melody:
  - {stat: 58, value: Param1, target: main, event: "hit:main:ult_dmg", duration: Param3, max_stacks: Param2, note: "Courage per Ultimate DMG hit"}
harmony2:
  - {stat: 56, value: Param1, target: main, event: "hit:main:ult_dmg", duration: Param3, max_stacks: 10, note: "per Courage stack; starts when Courage ends, modelled from the ult hit"}
overrides:
  - {part: harmony1, stat: 1, event: "hit:any:skill_dmg"}   # Ignis squad ATK when an Ignis Trekker deals Skill DMG (text)
