# Fireworks — melody and harmony 2 are scripted. Harmony 1 comes from EffectIds.
# Stats: 56 Auto DMG, 57 Skill DMG.
# Explosive Flame: +1 stack per round fired (+3 per skill), max 10, all removed 3 s after... (text).
# Modelled as a rolling 3 s window of Auto DMG hits, so it sits near 10 stacks while the main shoots.
melody:
  - {stat: 56, value: Param2, target: main, event: "hit:main:auto_dmg", duration: Param6, max_stacks: Param3, note: "Explosive Flame, 1 stack per round (rolling window; skill's +3 ignored)"}
  - {stat: 56, value: Param4, target: main, event: "hit:main:auto_dmg", every: Param3, duration: Param5, note: "at max Explosive Flame"}
harmony2:
  - {stat: 57, value: Param1, target: main, event: "hit:main:auto_dmg", duration: 3, max_stacks: 10, note: "per Explosive Flame stack"}
overrides:
  - {part: harmony1, stat: 57, event: "mark:any", duration: 4}   # Ignis squad Skill DMG when anyone triggers an Ignis Mark (text)
