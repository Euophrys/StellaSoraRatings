# Touch of Miracle (Terra). Harmony 1's Terra DMG comes from an EffectId; Assembly is scripted.
# Assembly: a Terra Vanguard's skill cast, 15 s, max 3 (harmony 2; both harmonies are always active in the sim).
# Shared by all Terra Vanguards in the team. "Has N stacks" read as N or more.
melody:
  - {stat: 0, value: 0, name: assembly, target: "class:1", event: "cast:class1/element3:skill|cast:class1/element3:recast",
     duration: Param1, max_stacks: 3}
  - {stat: 57, value: Param2, target: "class:1", event: "while:status:assembly>=1"}
  - {stat: 1, pct: true, value: Param3, target: "class:1", event: "while:status:assembly>=2"}
harmony1:
  - {stat: 57, value: Param2, target: "class:1", event: "while:status:assembly", per_stack: true}
harmony2:
  - {stat: 58, value: Param1, target: "class:1", event: "while:status:assembly>=3"}
