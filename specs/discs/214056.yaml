# Dappled Sunlight — melody and harmony 2 are scripted; harmony 1's Ripple Echo part too.
# Stats: 1 ATK, 17 Aqua DMG, 57 Skill DMG.
melody:
  - {stat: 17, value: Param1, name: ripple_echo, target: team, event: "cast:support:skill|on_field_5s:support",
     duration: Param2, max_stacks: Param3}
  - {stat: 1, pct: true, value: Param4, target: main, event: "mark:main&while:status:ripple_echo", duration: Param5}
harmony1:
  - {stat: 17, value: Param2, target: team, event: "while:status:ripple_echo", per_stack: true}
harmony2:
  - {stat: 57, value: Param1, target: team, event: "while:status:ripple_echo>=2"}
