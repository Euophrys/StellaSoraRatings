# Tilia (107) — Lux. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 107

talents:   # key talents, unlocked by dupes (specs/README.md)
  1070116:   # Divine Punishment (T1): text doesn't say whose ATK; squad, reading its size against her other squad buffs (8.4%)
    buffs:
      - {effect: 10796111, event: "damage:any&while:mark:5", target: team, duration: {ref: "BuffValue,NoLevel,10796111,Time,10K"}}
  1070232:   # Ward of Honor (T2)
    buffs:
      - {effect: 10796211, event: "cast:main:ult", target: main, duration: {ref: "BuffValue,NoLevel,10796211,Time,10K"}}
  1070348:   # Knight's Yearning (T3)
    buffs:
      - {effect: 10796311, event: "mark_applied:self", target: team, duration: {ref: "BuffValue,NoLevel,10796311,Time,10K"}}
  1070464:   # Legend Silhouette (T4)
    buffs:
      - {effect: 10796411, event: "mark:element5", target: main, duration: {ref: "BuffValue,NoLevel,10796411,Time,10K"}}
  1070580:   # Justice in You (T5)
    buffs:
      - {effect: 10796511, event: "while:squad:5:3", target: team}

main:
  untimed: true   # conservative guesses, see docs/assumptions.md "Untimed kits"; the ult's hits are user-timed (support role)

  actions:
    auto:
      duration: 4.4                # GUESS: 1 s per strike
      hits:
        - {hit: 107100001, offset: 0.4}
        - {hit: 107100002, offset: 1.4}
        - {hit: 107100003, offset: 2.4}
        - {hit: 107100004, offset: 3.4}

    skill:                         # Aegis Protection: a tap: the counter at once, no long hold (see the stance pinks)
      lock: 1.5                    # GUESS
      cd_start: 1.5               # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 107310001, offset: 1.0, tags: [counter], applies_mark: true}

    ult:                           # Glorious Smite: the slam and an 8 s sphere
      lock: 4.1                    # user-timed in the support role
      hits:
        - {hit: 107400001, offset: 0.6, tags: [ult]}
        - {hit: 107400002, count: 8, offset: 1.0, interval: 1.0, tags: [sphere], applies_mark: true}

  buffs:
    - {effect: 10793005, level: skill, event: "hit:self:counter", target: team, duration: {ref: "Buff,LevelUp,10793014,Time,10K"}}

  potentials:
    510701:   # Shield Counter (pink): needs a block; GUESS: a boss hit lands in 1 of 4 casts
      procs:
        - {event: "cast:self:skill", hit: 107310002, chance: 0.25, offset: 1.1, tags: [block], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:block", target: enemy}
    510702:   # Perfect Triangle Formation (pink): defensive
      note: "Defensive; no damage value."
    510703:   # Unity of Offense and Defense (pink): held for the full 8 s, a hit every 0.25 s
      add_actions:
        stance:
          followup: {after: skill}
          lock: 6.5
          skill_id: 10731000
          hits:
            - {hit: 107310301, count: 26, offset: 0.1, interval: 0.25, tags: [stance], requires: [510703]}
            - {hit: 0, count: 6, offset: 1.0, interval: 1.0, tags: [stance_tick], requires: [510704]}
      overrides:
        - {index: 0, event: "hit:self:stance", target: enemy}
    510704:   # Holy Domain (pink): held for the full 8 s, a stack per second
      add_actions:
        stance:
          followup: {after: skill}
          lock: 6.5
          skill_id: 10731000
          hits:
            - {hit: 107310301, count: 26, offset: 0.1, interval: 0.25, tags: [stance], requires: [510703]}
            - {hit: 0, count: 6, offset: 1.0, interval: 1.0, tags: [stance_tick], requires: [510704]}
      overrides:
        - {index: 0, event: "marker:self:stance_tick", target: enemy}
    510705:   # Block Enhancement: Lux: 1 of 4 casts
      overrides:
        - {index: 0, event: "cast:self:skill", every: 4, target: team}
    510706:   # Block Enhancement: ATK: 1 of 4 casts
      procs:
        - {event: "cast:self:skill", hit: 107310601, chance: 0.25, offset: 1.1, tags: [block_hit]}
    510707:   # Bright Counter
      overrides:
        - {index: 0, event: "hit:self:auto_dmg", target: team}
    510708:   # Aegis Blessing: 50% chance, as every 2nd
      overrides:
        - {index: 0, event: "hit:self:counter", every: 2, target: team}
    510709:   # Strike Back: needs the full 8 s hold, which the kit doesn't do without a stance pink
      overrides:
        - {index: 0, event: "marker:self:stance_tick", every: 6, target: team}
    510710:   # Unyielding Will: defensive
      note: "Defensive; no damage value."
    510711:   # Light Curtain
      overrides:
        - {index: 0, event: "mark_applied:self"}
    510712:   # Wild Spirit
      overrides:
        - {index: 0, event: "damage:self", icd: 10, target: team}
    510713:   # Revolt Call: DEF
      overrides:
        - {index: 0, drop: true}
        - {index: 1, drop: true}
    510741:   # Knight Oath: Skyfall
      overrides:
        - {index: 0, hit_tags: []}
    510742:   # Knight Oath: Chalk Armor: a shield
      note: "A shield: no damage value."
    510743:   # Knight Oath: Courage
      overrides:
        - {index: 0, event: "cast:self:ult", target: team}

support:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  on_field: {skill: 2.93, ult: 4.1}  # user-timed 2026-11-01: skill 21,19 -> 24,17; ult 11,12 -> 15,15
  actions:
    skill:                          # Aegis Intervention: bounces up to 6 times (text)
      hits:
        - {hit: 107320001, count: 6, offset: 0.4, interval: 0.3, tags: [aegis], applies_mark: true}
    ult:                            # Glorious Smite
      hits:
        - {hit: 107400001, count: 1, offset: 0.6, tags: [ult]}
        - {hit: 107400002, count: 8, offset: 1.0, interval: 1.0, tags: [sphere], applies_mark: true}  # GUESS: sphere ticks 1/s for 8 s

  buffs:
    - effect: 10795002             # squad ATK% when the skill deals DMG (value from data at support skill level)
      level: skill
      event: cast:self:skill
      duration: {ref: "Buff,LevelUp,10795012,Time,10K"}
      target: team

  potentials:
    510721:   # Holy Inscription (pink, not in build): spheres raise Lux DMG Taken
      overrides:
        - {index: 0, event: cast:self:skill}

    510722:   # Renewed Spectrum (pink): each Aegis hit cuts skill CD, limited per cast
      cd_reduce:
        action: skill
        seconds: {ref: "ScriptParameterValue,NoLevel,10722011,CommonData,10K"}
        times: {ref: "ScriptParameterValue,NoLevel,10722012,CommonData,10K"}

    510723:   # Perfect Spiral (pink): Aegis hits the main -> AoE hit + Skill DMG Taken stack
      add_hits:
        skill: [{hit: 107322301, count: 1, offset: 0.4, tags: [spiral]}]
      overrides:
        - {index: 0, event: "hit:self:spiral"}

    510725:   # Enemy Counter: vs stun-immune targets (bosses): extra hit + Lux DMG Taken
      add_hits:
        skill: [{hit: 107322501, count: 1, offset: 0.5, tags: [counter]}]   # GUESS: boss is stun-immune
      overrides:
        - {index: 0, event: "hit:self:counter"}

    510726:   # Blinding Beam: inflicting Lux Mark -> Mark DMG Taken
      overrides:
        - {index: 0, event: "hit:self:aegis"}

    510727:   # Knight's Seal: ally triggers Lux Mark -> squad stat
      overrides:
        - {index: 0, event: "mark:any", target: team}
      procs:
        - {event: "mark:any", hit: 0, energy: {param: Param3}}

    510728:   # Brilliant Relay: Aegis reaches the main -> main's stat, stacking
      overrides:
        - {index: 0, event: cast:self:skill, target: main}

    510730:   # Revealed Flaw: vs targets below an HP threshold (95% in data)
      add_hits:
        skill: [{hit: 107322301, count: 1, offset: 0.6, tags: [flaw]}]
      overrides:
        - {index: 0, event: "hit:self:flaw"}
      note: "Threshold from data is high (95%); assumed always met. ICD not modelled."

    510731:   # Guardian's Resolve: Tilia enters combat -> main's stat
      overrides:
        - {index: 0, event: cast:self:skill, target: main}   # GUESS: support "enters combat" on each support skill

    510729:   # Trick Boost: Aegis ricochets -> squad stat, stacking
      overrides:
        - {index: 0, event: "hit:self:aegis", target: team}

    510733:   # Banner of Glory: main's DEF (no damage)
      overrides:
        - {index: 0, event: always, target: main}

    510741:   # Knight Oath: Skyfall: Ult DMG on her ult
      overrides:
        - {index: 0, hit_tags: [ult]}

    510743:   # Knight Oath: Courage: ult cast -> squad stat
      overrides:
        - {index: 0, event: cast:self:ult, target: team}
