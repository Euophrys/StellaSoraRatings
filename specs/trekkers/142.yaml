# Cosette (142) — Umbra, Support. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
#
# User, frame-timed (2026-11-02, 30 fps; pinks Eclipse Imprint + Phantom Mark):
#   Skill cast 26,12; 13 claw hits (9 base + 4 Phantom Mark) at 27,11 27,21 28,01 28,11 28,25 29,06 29,16 29,26
#     30,10 30,21 31,01 31,11 31,25; leaves 33,23 (on the field 7.37 s).
#   Each claw leaves a claw mark for ~0.85 s (27,21 -> 28,16).
#   Ult cast 38,28; explosion 40,05 (+1.23 s); leaves 43,04 (4.2 s).
# Skill and ult hits inflict Umbra Mark: Gloom (Word 2018), triggered by Mistique.
char_id: 142

talents:   # key talents, unlocked by dupes (specs/README.md)
  1420116:   # Blasphemous Moon (T1)
    buffs:
      - {effect: 14296111, event: "cast:self:skill", target: team, duration: {ref: "BuffValue,NoLevel,14296111,Time,10K"}}
  1420232:   # Extinctive Downpour (T2)
    buffs:
      - {effect: 14296211, event: "cast:self:ult", target: main, duration: {ref: "BuffValue,NoLevel,14296211,Time,10K"}}
  1420348:   # Cloud of Embers (T3)
    buffs:
      - {effect: 14296311, event: "mark_applied:element6", target: team, duration: {ref: "BuffValue,NoLevel,14296311,Time,10K"}}
  1420464:   # Determined to Leave (T4): 25% chance (text) as every 4th hit
    buffs:
      - {effect: 14296411, event: "damage:self", target: main, duration: {ref: "BuffValue,NoLevel,14296411,Time,10K"}, every: 4}
  1420580:   # The New Me (T5)
    buffs:
      - {effect: 14296511, event: "while:squad:6:3", target: team}

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 142), not checked in game; the ult's hit is user-timed (support role)

  actions:
    auto:
      duration: 2.849              # frames: strikes chained at each combo-window end
      hits:
        - {hit: 142100001, offset: 0.244}
        - {hit: 142100002, offset: 0.565}
        - {hit: 142100003, count: 2, offset: 0.866, interval: 0.466}
        - {hit: 142100004, count: 2, offset: 1.816, interval: 0.116}
        - {hit: 142100005, offset: 2.449}

    skill:                         # Nocturn Hooks: x2 and x4 (text)
      lock: 1.367                  # frames: combo-window end
      cd_start: 1.367              # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 142300001, count: 2, offset: 0.233, interval: 0.0, tags: [hook], applies_mark: true}             # frames
        - {hit: 142300002, count: 4, offset: 0.65, interval: 0.033, tags: [hook, heavy], applies_mark: true}     # frames

    ult:                           # Dark Apocalypse
      lock: 2.378                  # frames: the cutscene clip's combo-window end (the support's 4.2 s includes leaving)
      hits:
        - {hit: 142400001, offset: 1.233, tags: [ult], applies_mark: true}

  buffs:
    - {effect: 14293001, level: skill, event: "hit:self:hook", duration: {ref: "Buff,LevelUp,14293011,Time,10K"}, target: enemy}

  potentials:
    514201:   # Nocturn Rip (pink)
      overrides:
        - {index: 0, event: "cast:self:skill", target: team}
        - {index: 1, hit_tags: [heavy]}
    514202:   # Nightscar Trace (pink): the squad's crits, 5 per cast (GUESS: 50% Crit Rate); the CD cut isn't modelled
      procs:
        - {event: "hit:main:any", hit: 142300004, chance: 0.5, icd: 2.4, tags: [claw], applies_mark: true}
    514203:   # Netherworld Touch (pink): her autos' Mark isn't modelled
      overrides:
        - {index: 0, event: "cast:self:skill"}
        - {index: 1, event: "cast:self:skill"}
    514204:   # Nocturn Mark (pink)
      procs:
        - {event: "mark_applied:self", every: 3, icd: 1, hit: 142300005, tags: [claw_mark], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:claw_mark"}
    514205:   # Darkclaw Haunt
      overrides:
        - {index: 0, event: "hit:self:hook"}
    514206:   # Darkclaw Mark: kills
      overrides:
        - {index: 0, drop: true}
    514207:   # Darkclaw Etch
      overrides:
        - {index: 0, event: "cast:self:skill", target: team}
    514208:   # Twilight Wish
      overrides:
        - {index: 0, event: "hit:self:auto_dmg", target: team}
    514209:   # Nightshadow Invasion: DEF
      overrides:
        - {index: 0, drop: true}
    514210:   # Nightshadow Veil: a shield
      note: "A shield: no damage value."
    514211:   # Shadowflash Enigma
      overrides:
        - {index: 0, event: "dodge:main", target: support}
    514212:   # Shadowflash Companion
      overrides:
        - {index: 0, event: "dodge:main"}
    514213:   # Starmark Nether
      overrides:
        - {index: 0, event: "mark:element6", target: team}
    514241:   # Spectral Ignition: a boss stays at the center
      overrides:
        - {index: 0, hit_tags: [ult]}
    514242:   # Nether Blaze
      overrides:
        - {index: 0, event: "hit:self:ult"}
    514243:   # Tainted Scar: lowers the target's ATK
      overrides:
        - {index: 0, drop: true}

support:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  on_field: {skill: 7.367, ult: 4.2}   # user-timed with Phantom Mark (GUESS: same without it)
  wait_on_field: true             # the ult cancels a running skill (user): wait for it to end

  actions:
    skill:                         # Abyssal Hunter: 9 claws (text "x9"); Phantom Mark adds 4
      hits:
        - {hit: 142300006, offset: 0.967, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 1.3, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 1.633, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 1.967, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 2.433, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 2.8, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 3.133, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 3.467, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 3.933, tags: [claw], applies_mark: true}
        - {hit: 142300006, offset: 4.3, tags: [claw], applies_mark: true, requires: [514223]}
        - {hit: 142300006, offset: 4.633, tags: [claw], applies_mark: true, requires: [514223]}
        - {hit: 142300006, offset: 4.967, tags: [claw], applies_mark: true, requires: [514223]}
        - {hit: 142300006, offset: 5.433, tags: [claw], applies_mark: true, requires: [514223]}
    ult:                           # Dark Apocalypse
      hits:
        - {hit: 142400001, offset: 1.233, tags: [ult], applies_mark: true}

  buffs:
    - effect: 14293005             # Abyssal Hunter DMG -> the target's Umbra DMG Taken, 6 s
      level: skill
      event: "hit:self:skill_dmg"
      duration: {ref: "Buff,LevelUp,14293015,Time,10K"}
      target: enemy

  potentials:
    514221:   # Abyssal Mark (pink): Umbra DMG Taken in the claw marks' range
      overrides:
        - {index: 0, event: "hit:self:claw"}
      note: "Up from each claw for the data's 2 s (claw marks last ~0.85 s, user)."

    514222:   # Eclipse Imprint (pink): pull; Umbra DMG Taken in the claw marks' range
      overrides:
        - {index: 0, event: "hit:self:claw"}
      note: "Up from each claw for the data's 2 s (claw marks last ~0.85 s, user)."

    514223:   # Phantom Mark (pink): +4 claws (hits above); every 4 claws, all friendly units' ATK
      overrides:
        - {index: 0, event: "hit:self:claw", every: 4, target: team, minions: true}

    514224:   # Phantom Inscription (pink): finishing strike; every 4 claws, all friendly units' ATK
      add_hits:
        skill:
          - {hit: 142300007, offset: 5.833, tags: [finisher], applies_mark: true, requires: [514223]}   # GUESS +0.4 s
          - {hit: 142300007, offset: 4.333, tags: [finisher], applies_mark: true, excludes: [514223]}   # GUESS +0.4 s
      overrides:
        - {index: 0, event: "hit:self:claw", every: 4, target: team, minions: true}

    514225:   # Dark: Demon Mark: skill DMG -> target's Umbra DMG Taken, 5 s
      overrides:
        - {index: 0, event: "hit:self:skill_dmg", target: enemy}

    514226:   # Dark: Mirage: Gloom on a target without a Mark -> all friendly units' ATK, 5 s
      overrides:
        - {index: 0, event: "mark_new:self", target: team, minions: true}
      note: "Fires when a Gloom lands while no Umbra Mark is up (e.g. right after Mistique triggered one)."

    514227:   # Dark: Vitality: main's DEF
      overrides:
        - {index: 0, drop: true}
      note: "DEF: no damage effect."

    514228:   # Dark: Hallucination: skill DMG -> all friendly units' ATK, 5 s, once per 0.5 s
      overrides:
        - {index: 0, event: "hit:self:skill_dmg", icd: 0.5, target: team, minions: true}
      note: "Stun chance not modelled."

    514230:   # Dark: Afterglow: Gloom on a target that already has one -> Umbra squadmates' ATK, 5 s
      overrides:
        - {index: 0, event: "mark_refresh:self", target: "element:6"}

    514231:   # Void Blessing: while Cosette is on the field, the main's ATK
      overrides:
        - {index: 0, event: "while:on_field:self", target: main}

    514232:   # Phantom Shelter: main's DEF while casting
      overrides:
        - {index: 0, drop: true}
      note: "DEF: no damage effect."

    514229:   # Dark: Form Breaker: 30% per Abyssal Hunter hit, -Param1 of max resilience, once per 0.5 s
      procs:
        - {hit: 0, event: "hit:self:claw", chance: 0.3, icd: 0.5, resilience: {param: Param1}}

    514233:   # Gift of Darkness: Umbra Trekkers' ATK
      overrides:
        - {index: 0, event: always, target: "element:6"}

    514241:   # Spectral Ignition (common): ult DMG to targets at the center
      overrides:
        - {index: 0, hit_tags: [ult]}
      note: "Single boss assumed at the center."

    514242:   # Nether Blaze (common): ult DMG -> target's Umbra DMG Taken, 10 s
      overrides:
        - {index: 0, event: "hit:self:ult_dmg", target: enemy}

    514243:   # Tainted Scar (common): enemy ATK down
      overrides:
        - {index: 0, drop: true}
      note: "Enemy ATK down: no damage effect."
