      overrides:
        - {index: 0, hit_tags: []}
    513242:   # Flash of Starlight: interval -30%
      add_hits:
        ult: [{hit: 132400001, count: 6, offset: 1.1, interval: 0.6, tags: [ketsu]}]   # 14 hits at 0.7x the interval: 6 more
      overrides:
        - {index: 0, hit_tags: [ketsu]}
    513243:   # Weakness Strike
      add_hits:
        ult:
          - {hit: 132400002, count: 2, offset: 2.0, interval: 0.5, tags: [ketsu]}
          - {hit: 132400003, offset: 3.0, tags: [ketsu]}

support:
  # User-timed 2026-11-17 (skill with Four-Star Wanted Level + Star Core Crumbled, and the ult)
  on_field: {skill: 4.367, ult: 5.0}   # user
  actions:
    skill:                         # Gi: Supernova Burst: 2 Astral Hex, one every 3 s (GUESS: each one explodes and goes)
      hits:
        - {hit: 132320001, offset: 1.0, tags: [gi]}   # user
        - {hit: 0, offset: 1.633, tags: [hex_on]}     # user: the hex lights land
        - {hit: 132320002, count: 2, offset: 4.033, interval: 3.067, tags: [hex], applies_mark: true}   # user: +4.033, +7.1
    ult:                           # user: 14 hits, first +0.9, last +4.367
      hits:
        - {hit: 132400001, count: 14, offset: 0.9, interval: 0.267, tags: [ketsu], excludes: [513231]}
        - {hit: 132400001, count: 14, offset: 0.9, interval: 0.267, tags: [ketsu], applies_mark: true, requires: [513231]}
        - {hit: 0, offset: 4.4, tags: [ult_done]}

  buffs:   # the target has Astral Hex from the lights landing to the last explosion
    - {name: astral_hex, event: "marker:self:hex_on", duration: 5.467, excludes: [513221]}
    - {name: astral_hex, event: "marker:self:hex_on", duration: 11.6, requires: [513221]}

  potentials:
    513221:   # Four-Star Wanted Level (pink): 4 stacks
      add_hits:
        skill: [{hit: 132320002, count: 2, offset: 10.167, interval: 3.067, tags: [hex], applies_mark: true}]
      overrides:
        - {index: 0, hit_tags: [gi, hex, hex_main]}
    513222:   # Radiant Burst (pink)
      overrides:
        - {index: 0, hit_tags: [hex, hex_main]}
    513223:   # Oath Satellite (pink): a shield
      note: "A shield: no damage value."
    513224:   # Star Core Crumbled (pink): the main picks up the Meteor 3 s after the hex hits (user: 2.9-3.3 s). The
      # Astral Hex stack the main gains explodes when it expires, dealing DMG, and summons no Meteor (user)
      procs:
        - {event: "hit:self:hex", hit: 0, offset: 3.0, tags: [meteor]}
        - {event: "marker:self:meteor", hit: 132320002, offset: 3.0, tags: [hex_main], applies_mark: true}   # GUESS: expires 3 s after the pickup
      overrides:
        - {index: 0, event: "marker:self:meteor", target: main}
    513225:   # Optimal Hit Zone: one stack counted
      overrides:
        - {index: 0, hit_tags: [], event: "while:status:astral_hex"}
    513226:   # Shutout Desire
      procs:
        - {event: "hit:main:any", when: "while:status:astral_hex", hit: 132526001, icd: 1.0, tags: [shutout]}
    513227:   # Final Score: one target, one stack
      overrides:
        - {index: 0, hit_tags: [hex, hex_main]}
    513228:   # Perfect Arc: x4; the extra Astral Hex isn't modelled
      add_hits:
        skill: [{hit: 132528001, count: 4, offset: 1.0, interval: 0.2, tags: [gi]}]
    513229:   # Three Base Hit: needs 3 targets
      overrides:
        - {index: 0, drop: true}
    513230:   # Fervent Applause: the main stays in range
      overrides:
        - {index: 0, event: "hit:self:hex", target: main}
    513231:   # Ashwind's Wrath
      overrides:
        - {index: 0, event: "cast:self:skill", reset_on: ["marker:self:ult_done"]}
    513232: {}   # Home Run State
    513233:   # Radiant Synergy: per Lux Trekker
      overrides:
        - {index: 0, max_stacks: 1, target: team, copies: [{event: "while:squad:5:1"}, {event: "while:squad:5:2"}, {event: "while:squad:5:3"}]}
    513241:
      ult_cost_scale: 1.25
      overrides:
        - {index: 0, hit_tags: []}
    513242:
      add_hits:
        ult: [{hit: 132400001, count: 5, offset: 1.2, interval: 0.7, tags: [ketsu]}]
      overrides:
        - {index: 0, hit_tags: [ketsu]}
    513243:
      add_hits:
        ult:
          - {hit: 132400002, count: 2, offset: 2.0, interval: 0.5, tags: [ketsu]}
          - {hit: 132400003, offset: 3.0, tags: [ketsu]}
