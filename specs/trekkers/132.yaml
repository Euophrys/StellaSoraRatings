      - {attribute: 13296511, event: always}

main:
  mark: {hit: 132000001}

  actions:
    auto:                          # user: next string's first hit 3.733 s after this one's
      duration: 3.733
      hits:
        - {hit: 132100001, offset: 0.233}   # user: 0.233 s after the skill ends
        - {hit: 132100002, offset: 0.7}
        - {hit: 132100003, offset: 1.4}
        - {hit: 132100004, offset: 2.133}   # she throws the spinning thing
        - {hit: 132100005, count: 6, offset: 2.133, interval: 0.227}   # x6 (text); user: the spinner, every ~7 frames to +3.267
        - {hit: 132100006, offset: 3.033, tags: [s5]}

    skill:                         # Syou: Pulsar Streak, then Two Base Hit: every 0.3 s for 3 s and a smash (text)
      # User: part 2 is ready 0.933 s after the cast (modelled as pressed then, and held); from the press, strikes at
      # +0.4 .. +1.833 (6, ~0.29 s apart), the smash +2.433, out of the skill +2.933. User: 6 strikes on a full hold
      # (checked twice), with no potentials.
      lock: 3.867
      cd_start: 0.317              # user: the 14 s CD runs as if started 0.267 / 0.367 s after the cast (two held casts)
      hits:
        - {hit: 132310001, offset: 0.133, tags: [syou], triggers_mark: true}           # user
        - {hit: 132310004, offset: 1.333, tags: [two_base], triggers_mark: true}       # user
        - {hit: 132310004, offset: 1.633, tags: [two_base], triggers_mark: true}
        - {hit: 132310004, offset: 1.867, tags: [two_base], triggers_mark: true}
        - {hit: 132310004, offset: 2.2, tags: [two_base], triggers_mark: true}
        - {hit: 132310004, offset: 2.467, tags: [two_base], triggers_mark: true}
        - {hit: 132310004, offset: 2.767, tags: [two_base], triggers_mark: true}
        - {hit: 132310005, offset: 3.367, tags: [two_base], triggers_mark: true}       # user: the smash
        - {hit: 0, offset: 3.867, tags: [skill_done]}

    ult:                           # Ketsu: every 0.3 s for 5 s (text; the area's data says every 0.25 s)
      lock: 1.0                    # frames: the cutscene clip's combo-window end; the clan attacks, she carries on
      hits:
        # user (as a support): 14 hits, first +0.9, last +4.367. The main's ult assumed to hit like the support's
        - {hit: 132400001, count: 14, offset: 0.9, interval: 0.267, tags: [ketsu]}

  potentials:
    513201:   # Ultimatum (pink): Three Base Hit x2 and a big hit
      add_hits:
        skill:
          - {hit: 132310101, count: 2, offset: 3.867, interval: 0.1, tags: [three], triggers_mark: true}   # GUESS: after the smash (frames: 0.1 apart); lock not extended
          - {hit: 132310102, offset: 4.767, tags: [three], triggers_mark: true}
    513202:   # Clan Clash Artistry (pink): the Two Base Hit part isn't modelled (needs a Mark first)
      add_hits:
        skill: [{hit: 132310204, offset: 4.867, tags: [three], requires: [513201]}]
      overrides:
        - {index: 0, hit_tags: [three]}
    513203:   # Board Tricks (pink)
      overrides:
        - {index: 0, event: "mark:element5"}
        - {index: 1, hit_tags: [syou]}
    513204:   # No Respite (pink): 3 extra hits, one per combo hit
      add_hits:
        skill: [{hit: 132310401, count: 3, offset: 1.333, interval: 0.3, tags: [two_base]}]   # GUESS: with the first 3 strikes
      overrides:
        - {index: 0, hit_tags: [two_base]}
    513205:   # Ashwind Rhythm
      overrides:
        - {index: 0, event: "cast:self:skill"}
        - {index: 1, event: "cast:self:skill"}
    513206:   # Unyielding Strength
      overrides:
        - {index: 0, hit_tags: [syou, two_base, three], event: "hit:self:auto_dmg", reset_on: ["marker:self:skill_done"]}
    513207:   # On a Roll
      overrides:
        - {index: 0, hit_tags: [syou, two_base, three], event: "hit:self:syou|hit:self:two_base", reset_on: ["cast:self:skill"]}
    513208:   # Radiant Glow
