# Firefly (115) — Lux. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 115

talents:   # key talents, unlocked by dupes (specs/README.md)
  1150116:   # Photon Diffusion (T1)
    buffs:
      - {effect: 11596111, event: "mark:element5", target: enemy, duration: {ref: "BuffValue,NoLevel,11596111,Time,10K"}}
  1150232:   # Shining Blades (T2)
    buffs:
      - {effect: 11596211, event: "cast:self:skill", duration: {ref: "BuffValue,NoLevel,11596211,Time,10K"}}
  1150348:   # Plushie and Safehouse (T3)
    buffs:
      - {effect: 11596311, event: "damage:self", target: enemy, duration: {ref: "BuffValue,NoLevel,11596311,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,11596311,LaminatedNum,Fixed"}}
  1150464:   # Wings and Secret Friends (T4)
    buffs:
      - {effect: 11596411, event: "mark_applied:element5", duration: {ref: "BuffValue,NoLevel,11596411,Time,10K"}}
  1150580:   # Armaments and Angel Heart (T5)
    buffs:
      - {attribute: 11596511, event: always}

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 115), not checked in game; the ult is user-timed (support role)
  mark: {hit: 115000001}
  base_rules: {reset_cd: {ult: skill}}   # text: the ult resets her cooldowns

  actions:
    auto:
      duration: 2.201              # frames: strikes chained at each combo-window end
      hits:
        - {hit: 115100001, offset: 0.532}
        - {hit: 115100002, offset: 0.999}
        - {hit: 115100003, count: 4, offset: 1.976, interval: 0.004}

    skill:                         # Star Barrage: Artillery Form, 14 s; her autos become the 4 cannons firing in turn
      lock: 14.0                   # text
      hits:                        # frames: form entry 1.25 s, then a shot per cannon clip (0.467/0.467/0.5/0.6 s: one per 0.508 s)
        - {hit: 115110001, count: 25, offset: 1.4, interval: 0.508, tags: [cannon], triggers_mark: true}

    ult:                           # Stellar Torrent
      lock: 6.3                    # user-timed in the support role
      hits:
        - {hit: 115400001, count: 4, offset: 0.4, interval: 0.6, tags: [ult]}
        - {hit: 115400002, count: 2, offset: 1.2, interval: 1.1, tags: [ult]}
        - {hit: 115400003, count: 2, offset: 1.3, interval: 1.0, tags: [ult]}

  buffs:
    - {effect: 3012, name: glimmer, level: skill, event: "mark:self", target: enemy, duration: {ref: "Buff,LevelUp,3012,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,3012,LaminatedNum,Fixed"}}

  potentials:
    511501:   # Firefly Glow: Radiance (pink): all 4 cannons, every 0.5 s, as Auto Attack DMG
      replace_hits:
        skill: [{hit: 115110101, count: 100, offset: 1.4, interval: 0.125, tags: [cannon], triggers_mark: true}]   # from the form entry (frames)
    511502:   # Firefly Glow: Luminary (pink): 12 Focus; Auto DMG only helps with Radiance
      overrides:
        - {index: 0, hit_tags: [cannon], event: "hit:self:cannon", every: 12, duration: 14}
    511503:   # Firefly Glow: Convergence (pink): once per 10 s on a target
      procs:
        - {event: "hit:self:cannon", hit: 115506001, icd: 10, count: 5, offset: 0.4, interval: 0.4, tags: [sunray], triggers_mark: true}
    511504:   # Firefly Glow: Scatter Beam (pink): refracts to other targets only
      note: "Needs other targets."
    511505:   # Tide of Starmarks
      overrides:
        - {index: 0, event: "hit:self:cannon", target: team}
    511506:   # Radiant Rainfall: every 6 s in the form
      add_hits:
        skill:
          - {hit: 115110302, count: 4, offset: 6.0, interval: 0.1, tags: [volley], triggers_mark: true}
          - {hit: 115110302, count: 4, offset: 12.0, interval: 0.1, tags: [volley], triggers_mark: true}
          - {hit: 115110301, offset: 6.5, tags: [volley], triggers_mark: true}
          - {hit: 115110301, offset: 12.5, tags: [volley], triggers_mark: true}
    511507:   # Lone Star Gleam
      overrides:
        - {index: 0, hit_tags: []}
    511508:   # Astral Album
      add_hits:
        skill:
          - {hit: 115308001, offset: 0.4, tags: [round], triggers_mark: true}
          - {hit: 115308002, offset: 0.7, tags: [round], triggers_mark: true}
    511509:   # Luminous Rhythm: a cannon's next attack every 4 s: 1 attack in 16
      overrides:
        - {index: 0, hit_tags: [cannon], event: unknown, uptime: 0.0625, duration: inf, max_stacks: 1}
    511510:   # Flash Resonance
      overrides:
        - {index: 0, event: "hit:self:cannon&while:mark:5", target: team}
    511511:   # Blazing Radiance
      overrides:
        - {index: 0, event: always}
        - {index: 1, event: "mark:self"}
    511512:   # Absolute Brilliance
      mark_tags: [ult]
      overrides:
        - {index: 0, event: "mark:self"}
    511513:   # Phantom Blast
      procs:
        - {event: "dodge:main", hit: 115211301, icd: 7, tags: [shadow], triggers_mark: true}
    511541:   # Persistent Warmth: the ult resets the skill, so it's cast right after
      overrides:
        - {index: 0, event: "cast:self:ult"}
    511542:   # Ultimate Radiance
      overrides:
        - {index: 0, hit_tags: [ult]}
    511543:   # Radiance of Shattered Stars: below 80% HP (GUESS: 80% of the fight)
      overrides:
        - {index: 0, hit_tags: [ult], event: unknown, uptime: 0.8, duration: inf, max_stacks: 1}

# User, frame-timed (2026-11-01, Twin Shadow + Firefly; offsets in seconds after the cast at 1:13,11):
#   skill: first Giant Sword hit +2.40; first Flying Blade +2.97. Giant Sword strikes 1-3 between +2.40 and +4.30,
#          ~18 blade hits in that window; the charged Strike 4 at +5.57, then ~20 more blade hits. The loop
#          repeats every 5.5 s (next Strike 1 at +7.90), 3 loops = 6 blade volleys. Leaves at 1:34,27 (+21.53).
#   ult (58,00): hits +0.40 and +1.20; the second-part cutscene (1:00,00 -> 1:06,20) freezes time and isn't counted;
#          final hit at +2.30 game time; leaves at +6.30 game time.
support:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  on_field: {skill: 21.53, ult: 6.3}   # user-timed
  actions:
    skill:                          # Starflare Pursuit: Sword Form (text), CD from data
      hits:
        # Avalanche: Giant Sword: a 4-strike loop every 5.5 s, 3 loops (user-timed, with Twin Shadow; same assumed without)
        - {hit: 115120001, count: 3, offset: 2.4, interval: 5.5, tags: [giant_sword], applies_mark: true}
        - {hit: 115120002, count: 3, offset: 3.35, interval: 5.5, tags: [giant_sword], applies_mark: true}
        - {hit: 115120003, count: 3, offset: 4.3, interval: 5.5, tags: [giant_sword], applies_mark: true}
        - {hit: 115120004, count: 5, offset: 5.57, interval: 0.1, tags: [giant_sword], applies_mark: true}   # Strike 4 x5 (text)
        - {hit: 115120004, count: 5, offset: 11.07, interval: 0.1, tags: [giant_sword], applies_mark: true}
        - {hit: 115120004, count: 5, offset: 16.57, interval: 0.1, tags: [giant_sword], applies_mark: true}
        # Avalanche: Flying Blades without Twin Shadow: 2 blades every 3 s (text) over the 16 s Sword Form
        - {hit: 115120005, count: 10, offset: 3.0, interval: 1.5, tags: [flying_blade], applies_mark: true, excludes: [511521]}
    ult:                            # Stellar Torrent: 2 shots, each x2 cannon + 2 slashes (text); game-time offsets
      hits:
        - {hit: 115400001, count: 4, offset: 0.4, interval: 0.6, tags: [ult]}
        - {hit: 115400002, count: 2, offset: 1.2, interval: 1.1, tags: [ult]}
        - {hit: 115400003, count: 2, offset: 1.3, interval: 1.0, tags: [ult]}
      # "All of Firefly's skill Cooldowns are reset when Stellar Torrent ends" (text)

  base_rules:
    reset_cd: {ult: skill}

  potentials:
    511521:   # Radiance Blade: Twin Shadow (pink, all-Lux squad): more Flying Blades, faster; stacking blade buffs
      add_hits:   # user: 6 volleys of ~19 hits each (with Radiance Blade: Firefly's bursts) -> ~10 blade hits per volley GUESS
        skill:
          - {hit: 115120005, count: 10, offset: 2.97, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
          - {hit: 115120005, count: 10, offset: 5.7, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
          - {hit: 115120005, count: 10, offset: 8.47, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
          - {hit: 115120005, count: 10, offset: 11.2, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
          - {hit: 115120005, count: 10, offset: 13.97, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
          - {hit: 115120005, count: 10, offset: 16.7, interval: 0.19, tags: [flying_blade], applies_mark: true, squad: "5:3"}
      overrides:   # stacks per blade hit while this Sword Form is active (cleared by the next cast)
        - {index: 0, hit_tags: [flying_blade], event: "hit:self:flying_blade", duration: inf,
           max_stacks: {ref: "BuffValue,NoLevel,11521011,LaminatedNum,Fixed"}, reset_on: ["cast:self:skill"]}
        - {index: 1, hit_tags: [flying_blade], event: "hit:self:flying_blade", duration: inf,
           max_stacks: {ref: "BuffValue,NoLevel,11521011,LaminatedNum,Fixed"}, reset_on: ["cast:self:skill"]}
      note: "Blade/burst split of the ~19 hits per volley is a guess (10 blades + their bursts)."

    511522:   # Radiance Blade: Firefly (pink): blade Crit Rate; each blade hit adds an AoE hit + Mark
      procs:
        - {event: "hit:self:flying_blade", hit: 115122202, offset: 0.05, tags: [blade_burst], applies_mark: true}   # one per Flying Blade hit (text)
      overrides:
        - {index: 0, hit_tags: [flying_blade]}

    511523:   # Radiance Blade: Blazing Edge (pink, not in build)
      add_hits:
        skill: [{hit: 115122305, count: 16, offset: 0.6, interval: 1.0, tags: [giant_sword_extra], applies_mark: true}]  # GUESS: one per Giant Sword strike
      overrides:
        - {index: 0, hit_tags: [giant_sword]}

    511524:   # Radiance Blade: Pursuing Slash (pink, not in build): Dominating Slash after 8 Giant Sword attacks
      add_hits:
        skill:
          - {hit: 115322401, count: 2, offset: 6.0, interval: 8.0, tags: [slash], applies_mark: true}  # GUESS: twice per Sword Form
          - {hit: 115322402, count: 4, offset: 6.3, interval: 4.0, tags: [slash], applies_mark: true}
          - {hit: 115322403, count: 6, offset: 6.6, interval: 2.6, tags: [slash], applies_mark: true}

    511525:   # Lightforged Blade: Glow/Halo stacks from main's Marks, consumed on support skill cast
      overrides:
        - {index: 0, hit_tags: [flying_blade], stacks: 6}   # GUESS: ~6 Mark triggers between casts
        - {index: 1, hit_tags: [flying_blade], stacks: 6}

    511526:   # Stellar Crash: main's Skill DMG fires a Flying Blade; Lux DMG Taken stacks per blade
      procs:
        - {event: "hit:main:skill_dmg", hit: 115322601, icd: {ref: "ScriptParameterValue,NoLevel,11526011,CommonData,10K"}, tags: [stellar_blade], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:stellar_blade", stacks_from: glimmer}   # adds one stack per Glimmer stack on the target
      note: "Each blade adds as many debuff stacks as the target has Glimmer (Light Curtain) stacks."

    511527:   # Blade of Falling Petals: Sword Form end -> 4 Avalanches x2; Skill Crit DMG stacks
      add_hits:
        skill: [{hit: 115322701, count: 8, offset: 18.4, interval: 0.1, tags: [petals], applies_mark: true}]   # Sword Form ends ~+18.4 (user-timed start +2.4, 16 s)
      overrides:
        - {index: 0, event: "hit:self:petals"}

    511528:   # Blade Flash: Giant Sword stacking Auto DMG
      overrides:
        - {index: 0, drop: true}                         # Movement SPD
        - {index: 1, hit_tags: [giant_sword], stacks: {ref: "BuffValue,NoLevel,11528011,LaminatedNum,Fixed", times: 0.6}}  # GUESS average stacks

    511530:   # Radiant Ripple: Giant Sword hits proc an extra hit, ICD from data
      procs:
        - {event: "hit:self:giant_sword", hit: 115323001, icd: {ref: "ScriptParameterValue,NoLevel,11530011,CommonData,10K"}, tags: [ripple], applies_mark: true}

    511531:   # Sanctuary of Light: ult inflicts Mark; shield (no damage)
      add_hits:
        ult: []
      note: "Ult Mark application not modelled separately (Sword Form already keeps Marks up)."

    511532:   # Cosmic Brilliance: support skill cast -> squad Lux Trekkers' stat
      overrides:
        - {index: 0, event: cast:self:skill, target: team}

    511529:   # Luminous Onslaught: on main's Mark trigger (Thunderbolt) -> enemy Lux DMG Taken, Firefly ATK
      overrides:
        - {index: 0, event: "mark:main"}
        - {index: 1, event: "mark:main"}
      note: "Text names Thunderbolt (another Lux Mark product); assumed to work with Noya's Lucent."

    511533:   # Domain of Purity: squad Lux DMG in all-Lux squad (+ more while Firefly is on field)
      overrides:
        - {index: 0, event: "while:squad:5:3", target: team}   # all-Lux squad only
        - {index: 1, event: "while:on_field:self", target: team}   # only while Firefly is on the battlefield
      note: "On-field bonus only during Firefly's casts (on_field seconds per cast)."

    511541:   # Persistent Warmth: after ult, next skill cast -> Lux DMG
      overrides:
        - {index: 0, event: cast:self:ult}

    511542:   # Ultimate Radiance: Ult DMG on her ult
      overrides:
        - {index: 0, hit_tags: [ult]}

    511543:   # Radiance of Shattered Stars: Ult DMG vs low-HP targets
      overrides:
        - {index: 0, hit_tags: [ult], uptime: 0.3}   # GUESS: target below threshold 30% of the fight
