# Canace (120) — Ventus Versatile. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 120

talents:   # key talents, unlocked by dupes (specs/README.md)
  1200116:   # Lost Youth (T1): Wreath lands 0.93 s after the cast (user-timed) and works for 6 s (text); as a main, Flying Leaves aren't authored
    buffs:
      - {attribute: 12096111, event: "cast:self:skill", target: team, duration: 6.533}
  1200232:   # Imminent Dawn (T2): kills: nothing against a single boss
    buffs: []
  1200348:   # Hidden Past (T3): "for each target hit": one stack per ult on a single target
    buffs:
      - {effect: 12096311, event: "cast:self:ult", target: team, duration: {ref: "BuffValue,NoLevel,12096311,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,12096311,LaminatedNum,Fixed"}}
  1200464:   # Mentor's Duty (T4)
    buffs:
      - {effect: 12096411, event: "mark:element4", duration: {ref: "BuffValue,NoLevel,12096411,Time,10K"}}
  1200580:   # Yearning for Truth (T5): normal and elite targets only: nothing against a boss
    buffs: []
#
# User's friend, frame-timed at 30 fps (2026-11-03), tutorial build: Grants Efficient Delving + Transformative Insight.
#   skill (55,21): Laurel Wreath's first hit +0.93 (main standing on the boss); one full spin ~1.5 s
#     (same position at 56,19 and ~58,04); leaves +3.37.
#   ult (23,12): hits +1.2 x2, then x2 every ~0.23 s; leaves +8.73.

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 120), not checked in game; the ult's hit spacing is user-timed (support role)
  mark: {hit: 120000001}

  actions:
    auto:
      duration: 3.01               # frames: strikes chained at each combo-window end
      hits:
        - {hit: 120100001, offset: 0.396, tags: [shot]}
        - {hit: 120100002, offset: 0.859, tags: [shot]}
        - {hit: 120100003, offset: 1.285, tags: [shot]}
        - {hit: 120100004, offset: 1.804, tags: [shot]}
        - {hit: 120100005, count: 2, offset: 2.72, interval: 0.1, tags: [shot]}

    skill:                         # Verdant Shroud, then 2 Flying Leaves for 7.2 s; GUESS: a leaf hits every 0.6 s
      lock: 1.333                  # frames: combo-window end
      cd_start: 1.333              # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 120310002, offset: 0.333, tags: [shroud], triggers_mark: true}           # frames
        - {hit: 120310001, count: 24, offset: 0.8, interval: 0.3, tags: [leaf], triggers_mark: true}   # frames: leaves launched +0.5

    ult:                           # Double Tempest
      lock: 5.87                   # frames: she stays in the loop clip while the cyclones hit: start 1.133 + ~4.2 s of hits + end 0.533
      hits:
        - {hit: 120400001, count: 9, offset: 1.133, interval: 0.233, tags: [tempest]}   # frames: first pair as the loop starts
        - {hit: 120400001, count: 9, offset: 1.133, interval: 0.233, tags: [tempest]}
        - {hit: 0, offset: 5.0, tags: [ult_done]}

  potentials:
    512001:   # Most Admired (pink): 3 more leaves
      add_hits:
        skill: [{hit: 120310001, count: 36, offset: 1.1, interval: 0.2, tags: [leaf], triggers_mark: true}]
    512002:   # Ring Blitz (pink): twice as fast
      add_hits:
        skill: [{hit: 120310001, count: 24, offset: 1.15, interval: 0.3, tags: [leaf], triggers_mark: true}]
    512003:   # Erratic Weather (pink): 25% chance of another bullet
      procs:
        - {event: "hit:self:shot", hit: 120100001, chance: 0.25, offset: 0.1, tags: [extra_shot]}
      overrides:
        - {index: 0, event: always}
    512004:   # Positive Score (pink): 5 strikes after each skill; squadmates' Energy isn't counted
      overrides:
        - {index: 0, hit_tags: [shot], event: "cast:self:skill", duration: 6.4}
    512005:   # Subject Boost: 2 leaves for 7.2 s (more with Most Admired, not counted)
      overrides:
        - {index: 0, event: "cast:self:skill", duration: 7.2, stacks: 2, target: team}
    512006:   # Strength Leverage: lowers the target's ATK
      overrides:
        - {index: 0, event: always}
        - {index: 1, drop: true}
    512007:   # Comprehensive Praise
      overrides:
        - {index: 0, hit_tags: [leaf]}
    512008:   # Friendly Mentor
      overrides:
        - {index: 0, event: "cast:self:skill|cast:support:skill"}
    512009:   # Unique Teaching
      overrides:
        - {index: 0, hit_tags: []}
    512010:   # Counterstrike Tutorial: the final strike after a dodge
      procs:
        - {event: "dodge:main", hit: 120100005, icd: 5, count: 2, offset: 0.2, interval: 0.2, tags: [counter]}
      overrides:
        - {index: 0, hit_tags: [counter]}
    512011:   # Lone Star Twinkle
      mark_tags: [tempest]
      overrides:
        - {index: 0, event: "mark:self"}
    512012:   # Weakness Analysis: 30% chance, as every 3rd
      overrides:
        - {index: 0, event: "hit:self:shot", every: 3}
    512013:   # Shadow Stride
      overrides:
        - {index: 0, event: "dodge:main"}
    512041:   # Storm Suppression: 17 x 2
      add_hits:
        ult: [{hit: 120400001, count: 16, offset: 1.3, interval: 0.233, tags: [tempest]}]
    512042:   # Structure Shatter
      overrides:
        - {index: 0, event: "hit:self:tempest", reset_on: ["marker:self:ult_done"]}
    512043:   # Downwind Area
      overrides:
        - {index: 0, event: "cast:self:ult"}

support:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  on_field: {skill: 3.367, ult: 8.733}   # user-timed
  actions:
    skill:                         # Laurel Halo: every 0.4 s for 6 s (text), inflicts Breeze
      hits:
        - {hit: 120320001, count: 15, offset: 0.933, interval: 0.4, tags: [wreath], applies_mark: true, excludes: [512021]}
        - {hit: 120320001, count: 30, offset: 0.933, interval: 0.2, tags: [wreath], applies_mark: true, requires: [512021]}   # Efficient Delving: interval -50%
        # full spins of the wreath (1.5 s, user-timed): 4 in 6 s; 6 with Speedup Notion (+50% rotation speed)
        - {hit: 0, count: 4, offset: 2.433, interval: 1.5, tags: [spin], excludes: [512023]}
        - {hit: 0, count: 6, offset: 1.933, interval: 1.0, tags: [spin], requires: [512023]}
    ult:                           # Double Tempest: 2 cyclones x9 (text), user-timed spacing
      hits:
        - {hit: 120400001, count: 9, offset: 1.2, interval: 0.233, tags: [tempest]}
        - {hit: 120400001, count: 9, offset: 1.2, interval: 0.233, tags: [tempest]}

  potentials:
    512021:   # Grants Efficient Delving (pink): interval -50% (hits above); Skill DMG
      overrides:
        - {index: 0, hit_tags: [wreath]}

    512022:   # Grants Transformative Insight (pink): range +30%; Skill DMG
      overrides:
        - {index: 0, hit_tags: [wreath]}
      note: "Range has no value vs a single boss."

    512023:   # Grants Speedup Notion (pink): rotation +50% (spins above); Skill DMG
      overrides:
        - {index: 0, hit_tags: []}

    512024:   # Grants Blooming Esthetics (pink): the wreath spins around the main and hits around her
      add_hits:
        skill: [{hit: 120524001, count: 4, offset: 2.433, interval: 1.5, tags: [bloom], applies_mark: true}]   # GUESS: one hit per spin
      note: "GUESS: one hit per full spin."

    512025:   # Structure Analysis: wreath DMG -> Ventus DMG Taken, 6 stacks, 8 s
      overrides:
        - {index: 0, event: "hit:self:wreath", target: enemy}

    512026:   # Conundrum Solving: wreath Skill DMG vs elite+ (a boss)
      overrides:
        - {index: 0, hit_tags: [wreath]}

    512027:   # Conclusion Analysis: wreath Skill DMG; after a break, Ventus DMG Taken 15 s
      overrides:
        - {index: 0, event: "while:broken", target: enemy}
        - {index: 1, hit_tags: [wreath]}
      note: "Break debuff modelled as 'while broken' (it lasts 15 s from the break, the break ~10 s)."

    512028:   # High Pressure Reflux: each wreath hit (1/s) -> later Skill DMG of that cast
      overrides:
        - {index: 0, hit_tags: [wreath], event: "hit:self:wreath", icd: 1.0, max_stacks: 6, duration: 7.0, reset_on: ["cast:self:skill"]}
      note: "GUESS: stacks once per second within a cast (6 max), reset on recast."

    512029:   # Cyclone Acceleration: each full spin -> later Skill DMG of that cast
      overrides:
        - {index: 0, hit_tags: [wreath], event: "marker:self:spin", max_stacks: 6, duration: 7.0, reset_on: ["cast:self:skill"]}
      note: "GUESS: stacks per spin within a cast, reset on recast."

    512031:   # My Thoughts: ult inflicts Breeze; Ultimate DMG
      add_hits:
        ult: [{hit: 0, count: 4, offset: 1.2, interval: 1.0, tags: [tempest_mark], applies_mark: true}]   # GUESS: Breeze once per second
      overrides:
        - {index: 0, hit_tags: []}

    512030:   # Storm Eye Expansion: each full spin -> main's ATK, 6 stacks, 3 s
      overrides:
        - {index: 0, event: "marker:self:spin", target: main}

    512033:   # Finale Deduction: Canace's ATK per Ventus Trekker
      overrides:
        - {index: 0, max_stacks: 1, copies: [{event: "while:squad:4:1"}, {event: "while:squad:4:2"}, {event: "while:squad:4:3"}]}
      note: "One stack per Ventus Trekker in the squad."

    512041:   # Storm Suppression: ult 17x2 hits instead of 9x2
      add_hits:
        ult:
          - {hit: 120400001, count: 8, offset: 3.297, interval: 0.233, tags: [tempest]}
          - {hit: 120400001, count: 8, offset: 3.297, interval: 0.233, tags: [tempest]}
      note: "17 ticks confirmed in game (user, tutorial build); extra ticks at the same spacing."

    512042:   # Structure Shatter: ult DMG -> Ultimate DMG stacks, reset when the ult ends
      overrides:
        - {index: 0, event: "hit:self:ult_dmg", duration: 6.0}

    512043:   # Downwind Area: ult cast -> Canace's ATK 20 s
      overrides:
        - {index: 0, event: "cast:self:ult"}
