    514941:   # Emberwing's Proclamation
      add_hits:
        ult: [{hit: 149400002, count: 2, offset: 0.85, interval: 0.15, tags: [ult], triggers_mark: true}]

    514942:   # Quadrifrons' Lore
      overrides:
