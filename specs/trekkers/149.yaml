    ult:
      hits:
        - {hit: 149400001, count: 3, offset: 0.367, interval: 0.03, tags: [ult], triggers_mark: true}
        - {hit: 149400001, count: 3, offset: 0.533, interval: 0.03, tags: [ult], triggers_mark: true}
        - {hit: 149400001, count: 3, offset: 0.700, interval: 0.03, tags: [ult], triggers_mark: true}

  potentials:
    514921:   # Deeper into Sin (pink): spades Skill DMG; 2 extra spades
      add_hits:
        skill: [{hit: 149321101, count: 2, offset: 0.933, interval: 0.0, tags: [spade], triggers_mark: true}]
      overrides:
        - {index: 0, hit_tags: [spade]}
      note: "User saw the hits in threes (1 + 2 spades)."

    514922:   # Curtain Call (pink): spades Skill DMG; each spade hits again when withdrawn
      add_hits:
        skill:
          - {hit: 149322101, count: 1, offset: 4.0, tags: [spade], triggers_mark: true}                       # GUESS: withdrawn after ~4 s
          - {hit: 149322101, count: 2, offset: 4.0, interval: 0.0, tags: [spade], triggers_mark: true, requires: [514921]}
          - {hit: 149322101, count: 1, offset: 7.8, tags: [spade], triggers_mark: true, requires: [514923]}  # GUESS: Sin-Bound Echo keeps them out until the waves end
      overrides:
        - {index: 0, hit_tags: [spade]}
      note: "Withdrawal time is a guess."

    514923:   # Sin-Bound Echo (pink): stays 6 s; a seismic wave at her and each spade every second
      add_hits:
        skill:
          - {hit: 149323101, count: 6, offset: 1.8, interval: 1.0, tags: [wave, echo], triggers_mark: true}
          - {hit: 149323101, count: 6, offset: 1.8, interval: 1.0, tags: [wave, echo], triggers_mark: true}
          - {hit: 149323101, count: 6, offset: 1.8, interval: 1.0, tags: [wave, echo], triggers_mark: true, requires: [514921]}
      note: "2 waves per second (her + 1 spade), 3 with Deeper into Sin (user saw threes)."

    514924:   # Earthshaker (pink): seismic waves Skill DMG
      overrides:
        - {index: 0, hit_tags: [wave]}

    514925:   # Hexacalamity: Grief's Toll: skill cast -> Skill DMG 3 s
      overrides:
        - {index: 0, event: "cast:self:skill"}

    514926:   # Hexacalamity: Tyrant's March: spades vs targets under 70% HP
      overrides:
        - {index: 0, hit_tags: [spade], event: unknown, uptime: 0.7}   # GUESS: the boss is under 70% HP for 70% of the fight
      note: "Under-70%-HP uptime is a guess (70%)."

    514927:   # Hexacalamity: Hallowed Chains: the chain shovel hit adds a Skill DMG hit
      add_hits:
        skill: [{hit: 149327101, count: 1, offset: 0.95, tags: [spade], triggers_mark: true}]

    514928:   # Hexacalamity: Erosion: Skill DMG +X every second during the skill, resets after
      overrides:
        - {index: 0, hit_tags: [], event: "while:on_field:self", stacks: 3}   # GUESS: ~3 s average into the 6 s echo
      note: "Average of 3 stacks over the skill (GUESS)."

    514930:   # Hexacalamity: Famine: seismic waves end -> AoE Skill DMG hit
      add_hits:
        skill:
          - {hit: 149330101, count: 1, offset: 1.6, tags: [wave], excludes: [514923]}   # GUESS timing
          - {hit: 149330101, count: 1, offset: 7.0, tags: [wave], requires: [514923]}
      note: "One extra hit when the waves end (GUESS: once per cast)."

    514931:   # Twilight's Verdict: Gerie triggers a Terra Mark -> Terra DMG stacks
      overrides:
        - {index: 0, event: "mark:self"}

    514932:   # Twilight's Hunt: a squadmate casts a skill or ult -> ATK stacks
      overrides:
        - {index: 0, event: "cast:main:skill|cast:main:ult|cast:support:skill|cast:support:ult"}
      note: "Counts her own support casts too (small overcount)."

    514929:   # Hexacalamity: Death: seismic waves Skill DMG + Resilience Break Efficiency
      overrides:
        - {index: 0, hit_tags: [wave]}
        - {index: 1, hit_tags: [wave]}

    514933:   # Anima Resonance: ATK per Terra Trekker
      overrides:
