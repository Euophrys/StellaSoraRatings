# Firstlight Noya (162) — Lux. Hits scale with Max HP (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 162

talents:   # key talents, unlocked by dupes (specs/README.md)
  1620116:   # Buried Past (T1)
    buff_events: {starender: "hit:self:any&once"}   # "Dealing any DMG grants her Starender. Once every 5 minutes" (> fight length)
    buffs:
      - {attribute: 16296111, event: "while:status:starender"}
  1620232:   # Night Watcher's Duty (T2)
    buffs:
      - {effect: 16296211, event: always}
      - {attribute: 16296221, event: "while:status:glimmer", hit_tags: [flurry, starfall]}
  1620348:   # Resolve Beyond Fate (T3)
    buffs:
      - {attribute: 16296311, event: always}
  1620464:   # Shining in the Night (T4)
    buffs:
      - {effect: 16296411, event: "mark:self", duration: {ref: "BuffValue,NoLevel,16296411,Time,10K"}}
  1620580:   # Meeting You at Dawn (T5): HP stays above 20%
    buffs:
      - {attribute: 16296511, event: always, hit_tags: [longsword]}
      - {attribute: 16296521, event: always, hit_tags: [greatsword]}
#
# User, frame-timed (2026-11-01, skill build: Lucent Blitz + Dawnflare, Prism Warp). Offsets in seconds after the cast.
#   auto string (start 11,14): greatsword hits +0.20, +0.53 | +1.03, +1.37, +1.60 | +2.33, +2.50; backflip, longsword
#     Strike 4 at +3.30, +3.40; dash (sprint attack) hits +4.10 x2, +4.30, +4.47, +4.77; next string's first hit at +4.90.
#   skill (40,15): first hit +0.07, Glows visible +0.17, last Glow fired +1.37, Glows return ~+1.70; first auto hit +2.30.
#     CD starts at the cast.
#   Radiance Flurry (27,09): control back at +1.40; no CD after it.
#   ult (3,27): control back at +3.23.

main:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  mark: {hit: 162000001}          # Lucent: Lux Mark DMG when Noya triggers a Mark

  actions:
    auto:
      duration: 4.7               # user-timed: next string's first hit 4.9 s after the start, first hit at +0.2
      hits:
        - {hit: 162100001, count: 2, offset: 0.2, interval: 0.333, tags: [greatsword, auto]}  # Strike 1 x2 (text, user-timed)
        - {hit: 162100002, count: 3, offset: 1.033, interval: 0.283, tags: [greatsword, auto]} # Strike 2 x3
        - {hit: 162100003, count: 2, offset: 2.333, interval: 0.167, tags: [greatsword, auto]} # Strike 3 x2
        - {hit: 162100004, count: 2, offset: 3.3, interval: 0.1, tags: [glow, auto]}          # Strike 4: 2 Glows
        # The backflip puts her out of range, so the string ends in a longsword sprint attack (x3, text; 1.5 s ICD)
        - {hit: 162100005, count: 3, offset: 4.1, interval: 0.183, tags: [longsword, sprint, auto], excludes: [516203]}  # Stardust Descent swaps it (below)
        # Dawnflare: the sprint also fires 3 Glows (user saw 5 hits total for the dash; 3 sprint + Glows overlapping, GUESS)
        - {hit: 162310009, count: 3, offset: 4.1, interval: 0.333, tags: [glow, auto], requires: [516202]}

    skill:                         # Storm Flash: Radiance, CD from data
      lock: 2.1                    # user-timed: first auto hit lands 2.3 s after the cast (auto's first hit is at +0.2)
      hits:
        - {hit: 162310001, count: 5, offset: 0.067, interval: 0.1, tags: [longsword], triggers_mark: true}  # x5 (text)
        - {hit: 162310002, count: 1, offset: 1.0, tags: [greatsword], triggers_mark: true}                  # GUESS timing
        - {hit: 162310008, count: 1, offset: 1.4, tags: [starfall], triggers_mark: true}                    # GUESS timing

    ult:                           # Empyrean Starender, greatsword form by default
      lock: 3.23                   # user-timed: 3,27 -> 7,04
      hits:
        - {hit: 162400001, count: 5, offset: 0.5, interval: 0.2, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516206]}  # x5 (text)
        - {hit: 162400002, count: 1, offset: 1.8, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516206]}
        # Longsword form (after Radiance Flurry with Resolve: Blitz): x7 dash + x7 field (text)
        - {hit: 162400003, count: 7, offset: 0.4, interval: 0.1, tags: [longsword, ult_ls], triggers_mark: true, requires: [516206]}
        - {hit: 162400004, count: 7, offset: 1.5, interval: 0.3, tags: [ult_ls], triggers_mark: true, requires: [516206]}

  procs:
    # The fight opens with a sprint attack: she has to close the distance to the boss (user). Same hits as the string's
    # sprint after the backflip; timing GUESS (at the start, before the first skill).
    - {event: "timer:1000&once", hit: 162100005, count: 3, interval: 0.183, tags: [longsword, sprint, auto], excludes: [516203]}
    - {event: "timer:1000&once", hit: 162310009, count: 3, interval: 0.333, tags: [glow, auto], requires: [516202]}   # Dawnflare
    - {event: "timer:1000&once", hit: 162100006, tags: [greatsword, sprint, auto], requires: [516203]}   # Stardust Descent
    - {event: "timer:1000&once", hit: 162310008, offset: 0.3, tags: [starfall], requires: [516203]}

  buffs:
    - effect: 3012                 # Glimmer (Word 4029): Lux DMG Taken per stack, applied by every Lucent (Mark trigger)
      name: glimmer
      level: skill
      event: mark:self
      duration: {ref: "Buff,LevelUp,3012,Time,10K"}
      max_stacks: {ref: "BuffValue,NoLevel,3012,LaminatedNum,Fixed"}
      target: enemy
    - attribute: 16290001          # auto attacks: each Glimmer stack raises the hit's EAT 85 "DMG Multiplier"
      level: auto
      event: "while:status:glimmer"
      per_stack: true
      hit_tags: [auto]
    - effect: 16290003             # Starender: Crit Rate (value from data at ult level)
      name: starender
      level: ult
      event: cast:self:ult
      duration: {ref: "Buff,LevelUp,16290003,Time,10K"}
      target: self

  potentials:
    516201:   # Lucent Blitz (pink): +4 longsword attacks and 9 Glows on skill
      add_hits:
        skill:
          - {hit: 162310001, count: 4, offset: 0.567, interval: 0.1, tags: [longsword], triggers_mark: true}  # "4 more longsword attacks"; reuses the x5 hit (GUESS)
          - {hit: 162310005, count: 9, offset: 0.167, interval: 0.15, tags: [glow]}                          # "fires 9 Glows" (text); user-timed +0.17 .. +1.37

    516202:   # Dawnflare (pink): 17 Glows -> Radiance Flurry follow-up
      add_actions:
        flurry:
          followup: {event: "hit:self:glow", every: {param: Param1}}   # every 17 Glows fired (data); ~every 2 skills with Lucent Blitz, matching in-game
          lock: 1.4                            # user-timed: 27,09 -> 28,21
          skill_id: 16231000                   # uses the main skill's level
          hits:
            - {hit: 162310003, count: 6, offset: 0.6, interval: 0.15, tags: [longsword, flurry], triggers_mark: true}  # x6 (text)
      note: "Sprint-attack Glows (3 per auto string) modelled; the string ends in a sprint after the backflip."

    516205:   # Prism Warp: Glows return; Skill Crit Rate on longsword + Glow hits
      add_hits:
        skill: [{hit: 162310006, count: 9, offset: 1.7, interval: 0.15, tags: [glow_return], requires: [516201]}]   # user-timed return ~+1.7
        auto:
          - {hit: 162310006, count: 2, offset: 3.8, interval: 0.1, tags: [glow_return]}
          - {hit: 162310006, count: 3, offset: 4.6, interval: 0.1, tags: [glow_return], requires: [516202]}   # sprint Glows (Dawnflare)
        ult: [{hit: 162310006, count: 7, offset: 2.5, interval: 0.1, tags: [glow_return], requires: [516241]}]
      overrides:
        - {stat: 71, hit_tags: [longsword, glow, glow_return]}
      note: "Returning Glows counted for skill, auto and Argent Mirage Glows."

    516206:   # Resolve: Blitz: flurry switches ult to longsword form (hits gated by `requires` above)
      overrides:
        - {index: 0, hit_tags: [longsword, glow, glow_return, ult_ls, flurry], event: "while:status:glimmer"}  # EAT 85 "DMG Multiplier" vs targets with Glimmer: a separate multiplier
      note: "Ult assumed always in longsword form once taken (flurry comes every 2 skills). Bonus applies while the target has Glimmer."

    516207:   # Lucent Tide: Glows trigger Marks; skill cast -> Skill Crit Rate / Crit DMG buff
      mark_tags: [glow]
      overrides:
        - {index: 0, event: cast:self:skill}
        - {index: 1, event: cast:self:skill, target: "class:2"}   # "Lux Versatile Trekkers" = class 2
      note: "Second buff goes to Lux Versatile (class 2) Trekkers. Range-increase chance ignored."

    516203:   # Stardust Descent (pink): extra Starfalls (AoE Lux Auto DMG, hit from Param2)
      add_hits:
        skill: [{hit: 162310008, count: 2, offset: 1.9, interval: 0.2, tags: [starfall]}]   # "+2 Starfalls" per skill (text); timing GUESS
        # "Auto Attack sprints become greatsword attacks ... and generate 1 Starfall" (text): the sprint after the backflip,
        # once per string (user), at the longsword sprint's +4.1. One hit (text); Starfall timing GUESS.
        auto:
          - {hit: 162100006, count: 1, offset: 4.1, tags: [greatsword, sprint, auto]}
          - {hit: 162310008, count: 1, offset: 4.4, tags: [starfall]}
      procs:
        - {event: "mark:self", hit: 162310008, icd: 1.0, offset: 0.3, tags: [starfall]}     # 1 Starfall per Mark trigger, 1 s ICD (text)
      note: "The sprint after the backflip (once per string) is the greatsword sprint + 1 Starfall."

    516204:   # Sinbreaker (pink): every N Starfalls absorbed -> next auto is Judgment Starfall
      procs:
        - {event: "hit:self:starfall", every: {ref: "BuffValue,NoLevel,16204011,LaminatedNum,Fixed"}, hit: 162100007, count: 2,
           offset: 0.5, interval: 0.3, icd: 0.0, tags: [greatsword, judgment, auto], triggers_mark: true}  # x2 (text); added on top of the auto string (GUESS: no auto hit lost)
      mark_tags: [greatsword]            # "They can also trigger Lux Mark" (text): the greatsword attacks
      overrides:
        - {index: 0, hit_tags: [auto]}   # "during Auto Attacks"
      note: "Judgment Starfall added on top of the auto string; every Starfall assumed absorbed."

    516208:   # Eclipse Phantom: field on Judgment Starfall (Sinbreaker)
      procs:
        - {event: "hit:self:judgment", hit: 162310010, count: 6, offset: 0.5, interval: 0.5, icd: 1.0, tags: [field], requires: [516204]}  # x6 (text); one field per Judgment
      overrides:
        - {stat: 70, hit_tags: [greatsword, starfall, ult_gs, judgment]}

    516209:   # Gavel of Absolution: lightning when each Starfall dissipates; skill cast -> Auto Crit Rate
      procs:
        - {event: "hit:self:starfall", hit: 162310007, offset: 2.0, tags: [lightning]}   # GUESS: every Starfall dissipates ~2 s after landing
      overrides:
        - {index: 0, event: cast:self:skill}

    516210:   # Resolve: Sunder: DEF PEN on greatsword/Starfalls (ult swap needs Judgment Starfall)
      overrides:
        - {stat: 9, hit_tags: [greatsword, starfall, ult_gs, judgment]}

    516211:   # Searing Sun: DMG vs Glimmer targets + flat stat
      overrides:
        - {index: 1, hit_tags: [], event: "while:status:glimmer"}   # DMG vs targets with Glimmer

    516212:   # Astral Brilliance: Lux PEN per Lux Trekker in squad
      overrides:
        - {index: 0, event: always, stacks: 3}   # all-Lux team: 3 stacks
      note: "Assumes 3 Lux Trekkers (true for the FL Noya team)."

    516241:   # Argent Mirage: 7 Glows on longsword-form ult; Skill DMG always on
      add_hits:
        ult: [{hit: 162400006, count: 7, offset: 1.0, interval: 0.1, tags: [glow], requires: [516206]}]
      note: "Glows need longsword-form ult (Resolve: Blitz)."

    516242:   # Empyrean Starfall: greatsword-form ult field
      add_hits:
        ult: [{hit: 162400007, count: 6, offset: 2.0, interval: 0.5, tags: [field], excludes: [516206]}]
      note: "Field needs greatsword-form ult (lost if Resolve: Blitz swaps the form)."

    516243:   # Guiding Star: Crit DMG while in Starender (ult buff)
      overrides:
        - {index: 0, event: cast:self:ult, duration: {ref: "Buff,LevelUp,16290003,Time,10K"}}
      # User clip 2026-11-07, Lv2 (0.9/s), T0, 30 fps: ult cast 47,18; first Energy visible 48,10, before the first auto hit at 51,00,
      # so it starts during the ult. Text trusted (user). Sim ticks on the whole second, not from the cast.
      procs:
        - {event: "timer:1", when: "while:status:starender", hit: 0, energy: {param: Param4}}   # every Param3 = 1 s (data, all levels)

support:
  timing: frames   # animation frame data (python -m ssr.inspect frames 162), not checked in game; the ult's hits are user-timed (main role)
  on_field: {skill: 9.22, ult: 8.38}  # frames: clips + the usual exit (ult: the greatsword cutscene clip)
  mark: {hit: 162000001}             # text: Thunderstrike: Break can trigger Lux Mark
  actions:
    skill:                         # Thunderstrike: Break x8, then x6 and a big hit (text)
      hits:
        - {hit: 162320001, count: 8, offset: 0.85, interval: 0.164, tags: [longsword], triggers_mark: true}   # frames: 2 per 0.333 s loop, 4 loops after a 0.8 s start
        - {hit: 162320002, count: 6, offset: 2.9, interval: 0.33, tags: [greatsword], triggers_mark: true}    # frames: greatsword clip from +2.133
        - {hit: 162320003, offset: 5.4, tags: [greatsword], triggers_mark: true}
    ult:                           # Greatsword form by default; Aegis: Blitz swaps it (Aegis: Sunder is the default anyway)
      hits:
        - {hit: 162400001, count: 5, offset: 0.5, interval: 0.2, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516229]}
        - {hit: 162400002, offset: 1.8, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516229]}
        - {hit: 162400003, count: 7, offset: 0.4, interval: 0.1, tags: [longsword, ult_ls], triggers_mark: true, requires: [516229]}
        - {hit: 162400004, count: 7, offset: 1.5, interval: 0.3, tags: [ult_ls], triggers_mark: true, requires: [516229]}

  buffs:
    - {effect: 3012, name: glimmer, level: skill, event: "mark:self", target: enemy, duration: {ref: "Buff,LevelUp,3012,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,3012,LaminatedNum,Fixed"}}
    - {effect: 16290003, name: starender, level: ult, event: "cast:self:ult", duration: {ref: "Buff,LevelUp,16290003,Time,10K"}}

  potentials:
    516221:   # Tempest Scourge (pink): a field, x6
      add_hits:
        skill: [{hit: 162320006, count: 6, offset: 5.466, interval: 0.5, tags: [field]}]   # frames: spawned +5.466
    516222:   # Inquisitor's Edge (pink): 11 Starfalls
      add_hits:
        skill: [{hit: 162320004, count: 11, offset: 2.983, interval: 0.167, tags: [starfall]}]   # frames: one per 0.167 s from +2.983
    516223:   # Skyrend Flash (pink): GUESS: a Glow per longsword attack
      add_hits:
        skill: [{hit: 162320005, count: 8, offset: 0.95, interval: 0.164, tags: [glow]}]
    516224:   # Galeblade (pink): 10 more
      add_hits:
        skill: [{hit: 162320001, count: 10, offset: 0.9, interval: 0.12, tags: [longsword], triggers_mark: true}]
    516225:   # Radiant Sever
      overrides:
        - {index: 0, event: "hit:self:starfall"}
    516226:   # Aegis: Sunder
      overrides:
        - {index: 0, event: "hit:self:longsword"}
    516227:   # Fiendbreaker
      overrides:
        - {index: 0, hit_tags: [greatsword, starfall]}
        - {index: 1, hit_tags: [greatsword, starfall]}
    516228:   # Sunfire Cleave
      overrides:
        - {index: 0, hit_tags: [longsword, glow]}
    516229:   # Aegis: Blitz: longsword form (hits above)
      overrides:
        - {index: 0, event: "hit:self:greatsword"}
    516230:   # Breath of Light
      overrides:
        - {index: 0, hit_tags: [longsword, glow]}
        - {index: 1, hit_tags: [longsword, glow]}
    516231:   # No More Goodbyes
      overrides:
        - {index: 0, max_stacks: 1, target: "element:5", copies: [{event: "while:squad:5:1"}, {event: "while:squad:5:2"}, {event: "while:squad:5:3"}]}
    516232:   # No More Sorrow
      overrides:
        - {index: 0, event: "cast:main:skill"}
    516233:   # No More Chains
      overrides:
        - {index: 0, event: "cast:element5:skill"}
    516241:   # Argent Mirage: needs the longsword form
      add_hits:
        ult: [{hit: 162400006, count: 7, offset: 1.0, interval: 0.1, tags: [glow], requires: [516229]}]
    516242:   # Empyrean Starfall: needs the greatsword form
      add_hits:
        ult: [{hit: 162400007, count: 6, offset: 2.0, interval: 0.5, tags: [field], excludes: [516229]}]
    516243:   # Guiding Star
      overrides:
        - {index: 0, event: cast:self:ult, duration: {ref: "Buff,LevelUp,16290003,Time,10K"}}
      procs:
        - {event: "timer:1", when: "while:status:starender", hit: 0, energy: {param: Param4}}
