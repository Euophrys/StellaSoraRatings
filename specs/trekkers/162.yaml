# Firstlight Noya (162) — Lux. Hits scale with Max HP (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 162

main:
  energy_per_second: 2.0          # GUESS passive ult energy regen
  mark: {hit: 162000001}          # Lucent: Lux Mark DMG when Noya triggers a Mark

  actions:
    auto:
      duration: 3.0               # GUESS: one 4-strike string in ~3 s, standing in melee (no sprint attacks)
      hits:
        - {hit: 162100001, count: 2, offset: 0.0, interval: 0.2, tags: [greatsword]}   # Strike 1 x2 (text)
        - {hit: 162100002, count: 3, offset: 0.7, interval: 0.15, tags: [greatsword]}  # Strike 2 x3 (text)
        - {hit: 162100003, count: 2, offset: 1.5, interval: 0.2, tags: [greatsword]}   # Strike 3 x2 (text)
        - {hit: 162100004, count: 2, offset: 2.3, interval: 0.1, tags: [glow]}         # Strike 4: 2 Glows (text)

    skill:                         # Storm Flash: Radiance, CD from data
      lock: 5.0                    # user-timed in game: ~5 s before autos resume
      hits:
        - {hit: 162310001, count: 5, offset: 0.2, interval: 0.15, tags: [longsword], triggers_mark: true}  # x5 (text)
        - {hit: 162310002, count: 1, offset: 1.3, tags: [greatsword], triggers_mark: true}
        - {hit: 162310008, count: 1, offset: 1.8, tags: [starfall], triggers_mark: true}

    ult:                           # Empyrean Starender, greatsword form by default
      lock: 4.0                    # user-timed in game: ~4 s
      hits:
        - {hit: 162400001, count: 5, offset: 0.5, interval: 0.2, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516206]}  # x5 (text)
        - {hit: 162400002, count: 1, offset: 1.8, tags: [greatsword, ult_gs], triggers_mark: true, excludes: [516206]}
        # Longsword form (after Radiance Flurry with Resolve: Blitz): x7 dash + x7 field (text)
        - {hit: 162400003, count: 7, offset: 0.4, interval: 0.1, tags: [longsword, ult_ls], triggers_mark: true, requires: [516206]}
        - {hit: 162400004, count: 7, offset: 1.5, interval: 0.3, tags: [ult_ls], triggers_mark: true, requires: [516206]}

  buffs:
    - effect: 16290003             # Starender: Crit Rate (value from data at ult level)
      level: ult
      event: cast:self:ult
      duration: {ref: "Buff,LevelUp,16290003,Time,10K"}
      target: self

  potentials:
    516201:   # Lucent Blitz (pink): +4 longsword attacks and 9 Glows on skill
      add_hits:
        skill:
          - {hit: 162310001, count: 4, offset: 1.0, interval: 0.15, tags: [longsword], triggers_mark: true}  # "4 more longsword attacks"; reuses the x5 hit (GUESS)
          - {hit: 162310005, count: 9, offset: 1.6, interval: 0.1, tags: [glow]}                            # "fires 9 Glows" (text)

    516202:   # Dawnflare (pink): 17 Glows -> Radiance Flurry follow-up
      add_actions:
        flurry:
          followup: {after: skill, every: 2}   # user: follow-up skill after every 2 skill casts
          lock: 3.0                            # user-timed in game: ~3 s
          skill_id: 16231000                   # uses the main skill's level
          hits:
            - {hit: 162310003, count: 6, offset: 0.6, interval: 0.15, tags: [longsword, flurry], triggers_mark: true}  # x6 (text)
      note: "Sprint-attack Glows not modelled (melee range assumed)."

    516205:   # Prism Warp: Glows return; Skill Crit Rate on longsword + Glow hits
      add_hits:
        skill: [{hit: 162310006, count: 9, offset: 2.3, interval: 0.1, tags: [glow_return], requires: [516201]}]
        auto: [{hit: 162310006, count: 2, offset: 2.8, interval: 0.1, tags: [glow_return]}]
        ult: [{hit: 162310006, count: 7, offset: 2.5, interval: 0.1, tags: [glow_return], requires: [516241]}]
      overrides:
        - {stat: 71, hit_tags: [longsword, glow, glow_return]}
      note: "Returning Glows counted for skill, auto and Argent Mirage Glows."

    516206:   # Resolve: Blitz: flurry switches ult to longsword form (hits gated by `requires` above)
      overrides:
        - {index: 0, as_stat: 50, hit_tags: [longsword, glow, glow_return, ult_ls, flurry], uptime: 1.0}  # EAT 85 (bonus vs Glimmer targets) treated as DMG; Glimmer always up GUESS
      note: "Ult assumed always in longsword form once taken (flurry comes every 2 skills). EAT 85 treated as DMG vs Glimmer targets."

    516207:   # Lucent Tide: Glows trigger Marks; skill cast -> Skill Crit Rate / Crit DMG buff
      mark_tags: [glow]
      overrides:
        - {index: 0, event: cast:self:skill}
        - {index: 1, event: cast:self:skill}
      note: "Second buff is for Lux Versatile Trekkers; modelled on Noya. Range-increase chance ignored."

    516208:   # Eclipse Phantom: field needs Judgment Starfall (Sinbreaker, not taken in skill build)
      add_hits:
        auto: [{hit: 162310010, count: 6, offset: 3.0, interval: 0.5, tags: [field], requires: [516204]}]  # GUESS: 1 Judgment Starfall per string
      overrides:
        - {stat: 70, hit_tags: [greatsword, starfall, ult_gs]}

    516209:   # Gavel of Absolution: lightning when Starfalls dissipate; skill cast -> Auto Crit Rate
      add_hits:
        skill: [{hit: 162310007, count: 1, offset: 4.0, tags: [lightning]}]   # 1 Starfall per skill (text); dissipates ~2 s later GUESS
      overrides:
        - {index: 0, event: cast:self:skill}

    516210:   # Resolve: Sunder: DEF PEN on greatsword/Starfalls (ult swap needs Judgment Starfall)
      overrides:
        - {stat: 9, hit_tags: [greatsword, starfall, ult_gs]}

    516211:   # Searing Sun: DMG vs Glimmer targets + flat stat
      overrides:
        - {index: 1, hit_tags: [], uptime: 1.0}   # GUESS: Glimmer always on the target (applied by every Mark trigger)

    516212:   # Astral Brilliance: Lux PEN per Lux Trekker in squad
      overrides:
        - {index: 0, event: always, stacks: 3}   # all-Lux team: 3 stacks
      note: "Assumes 3 Lux Trekkers (true for the FL Noya team)."

    516241:   # Argent Mirage: 7 Glows on longsword-form ult; Skill DMG always on
      add_hits:
        ult: [{hit: 162400006, count: 7, offset: 1.0, interval: 0.1, tags: [glow], requires: [516206]}]
      note: "Glows need longsword-form ult (Resolve: Blitz)."

    516242:   # Empyrean Starfall: greatsword-form ult field
      add_hits:
        ult: [{hit: 162400007, count: 6, offset: 2.0, interval: 0.5, tags: [field], excludes: [516206]}]
      note: "Field needs greatsword-form ult (lost if Resolve: Blitz swaps the form)."

    516243:   # Guiding Star: Crit DMG while in Starender (ult buff)
      overrides:
        - {index: 0, event: cast:self:ult, duration: {ref: "Buff,LevelUp,16290003,Time,10K"}}
      note: "Energy restore not modelled."

support:
  energy_per_second: 2.0          # GUESS
  actions:
    skill:
      hits:
        - {hit: 162320001, count: 8, offset: 0.2, interval: 0.1, tags: [longsword]}
        - {hit: 162320002, count: 6, offset: 1.2, interval: 0.2, tags: [greatsword]}
        - {hit: 162320003, count: 1, offset: 2.5, tags: [greatsword]}
    ult:
      hits:
        - {hit: 162400001, count: 5, offset: 0.5, interval: 0.2, tags: [greatsword]}
        - {hit: 162400002, count: 1, offset: 1.8, tags: [greatsword]}
