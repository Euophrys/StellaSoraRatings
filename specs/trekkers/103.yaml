# Amber (103) — Ignis. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 103

talents:   # key talents, unlocked by dupes (specs/README.md)
  1030116:   # A Dance with Bullets (T1)
    buffs:
      - {effect: 10396111, event: "damage:self", duration: {ref: "BuffValue,NoLevel,10396111,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,10396111,LaminatedNum,Fixed"}}
  1030232:   # Barrel is Still Hot (T2)
    buffs:
      - {effect: 10396211, event: "mark:self", duration: {ref: "BuffValue,NoLevel,10396211,Time,10K"}}
  1030348:   # Ethereal Memory (T3)
    buffs:
      - {effect: 10396311, event: "cast:self:skill|cast:self:recast", duration: {ref: "BuffValue,NoLevel,10396311,Time,10K"}}
  1030464:   # A Silent Long Road (T4)
    buffs:
      - {effect: 10396411, event: "hit:self:ult_dmg", duration: {ref: "BuffValue,NoLevel,10396411,Time,10K"}}
  1030580:   # Farsight Vision (T5)
    buffs:
      - {attribute: 10396511, event: always}

main:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  mark: {hit: 103000001}          # Incineration: Ignis Mark DMG when Amber triggers Sacred Flame

  actions:
    auto:                          # Duet: user, frame-timed: 12 shots in 2.03 s, then a 0.77 s reload. The string restarts after every cast (= reload).
                                   # No dodge-cancel here (user): a dodge before the reload only delays it, and the reload is too fast to interrupt.
      duration: 20.0               # longer than any gap between casts, so the first-magazine segment only plays after a cast
      skill_id: 10310000
      hits:
        # first magazine after a cast: 12 rounds (base), Bullet Storm AoE rounds, or 36 rounds (Dominant Firepower)
        - {hit: 103100001, count: 11, offset: 0.0, interval: 0.1849, tags: [auto, shot], excludes: [510301, 510302]}
        - {hit: 103100001, count: 1, offset: 2.034, tags: [auto, shot, mag_end], excludes: [510301, 510302]}
        - {hit: 103502001, count: 11, offset: 0.0, interval: 0.1849, tags: [auto, shot, storm], requires: [510302], excludes: [510301]}
        - {hit: 103502001, count: 1, offset: 2.034, tags: [auto, shot, storm, mag_end], requires: [510302], excludes: [510301]}
        - {hit: 103100001, count: 35, offset: 0.0, interval: 0.1849, tags: [auto, shot, dp], requires: [510301], excludes: [510302]}
        - {hit: 103100001, count: 1, offset: 6.472, tags: [auto, shot, dp, mag_end], requires: [510301], excludes: [510302]}
        - {hit: 103502001, count: 35, offset: 0.0, interval: 0.1849, tags: [auto, shot, dp, storm], requires_all: [510301, 510302]}
        - {hit: 103502001, count: 1, offset: 6.472, tags: [auto, shot, dp, storm, mag_end], requires_all: [510301, 510302]}
        # later magazines: 12 rounds 0.185 s apart, 0.77 s reload, repeating every 2.80 s
        - {hit: 103100001, count: 7, offset: 2.800, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 2.985, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 3.170, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 3.355, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 3.540, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 3.725, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 3.909, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 4.094, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 4.279, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 4.464, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 4.649, interval: 2.800, tags: [auto, shot], excludes: [510301]}
        - {hit: 103100001, count: 7, offset: 4.834, interval: 2.800, tags: [auto, shot, mag_end], excludes: [510301]}
        - {hit: 103100001, count: 5, offset: 7.238, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 7.423, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 7.608, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 7.793, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 7.977, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 8.162, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 8.347, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 8.532, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 8.717, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 8.902, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 9.087, interval: 2.800, tags: [auto, shot], requires: [510301]}
        - {hit: 103100001, count: 5, offset: 9.272, interval: 2.800, tags: [auto, shot, mag_end], requires: [510301]}

    skill:                         # Fireworks Jam: x2 + x4 (text), CD from data
      lock: 2.333                  # user, frame-timed: recast usable 2,10 after the skill (38,12 -> 40,22, 30 fps)
      hits:                        # user, frame by frame (2026-11-06): shot 1 0,06; shot 2 0,26; shot 3 is 8 small hits, 2 per frame from 1,20
        - {hit: 103310002, count: 1, offset: 0.2, tags: [fj], triggers_mark: true}
        - {hit: 103310002, count: 1, offset: 0.867, tags: [fj], triggers_mark: true}
        - {hit: 103310001, count: 2, offset: 1.667, interval: 0, tags: [fj], triggers_mark: true}
        - {hit: 103310001, count: 2, offset: 1.7, interval: 0, tags: [fj], triggers_mark: true}
        - {hit: 103310001, count: 2, offset: 1.733, interval: 0, tags: [fj], triggers_mark: true}
        - {hit: 103310001, count: 2, offset: 1.767, interval: 0, tags: [fj], triggers_mark: true}

    ult:                           # Spark of Finality
      lock: 1.167                  # user, frame-timed: 03,18 -> can attack 04,23
      hits:
        - {hit: 103400001, count: 1, offset: 0.5, tags: [ult], triggers_mark: true}

  buffs:
    - effect: 10331001             # Fireworks Jam: Auto DMG for 10 s (text)
      level: skill
      event: "cast:self:skill|cast:self:recast"
      duration: {ref: "BuffValue,NoLevel,10331001,Time,10K"}
      target: self

  potentials:
    510301:   # Dominant Firepower (pink): 36-round reload after skill; Auto DMG until the magazine is empty
      overrides:
        - {index: 0, event: always, hit_tags: [dp]}
      note: "36 rounds after each Fireworks Jam (auto string variant). The ult also restarts the string (GUESS)."

    510302:   # Bullet Storm (pink): full reload after skill; AoE rounds (own hit) until the magazine is empty
      note: "Rounds of the first magazine after a cast use the AoE hit. Single target: AoE adds nothing."

    510303:   # Precise Temperature Control (pink): recast within 2 s; +DMG multiplier if the first cast triggered a Mark
      add_actions:
        recast:
          # User, frame-timed: dodge at 1,24 (the earliest that keeps every hit, 40,06), recast 0,10 later (41,26 -> 42,06).
          followup: {after: skill, every: 1, dodge_cancel: {at: 1.8, duration: 2.133}}
          lock: 1.833              # user: first auto 1,25 after the recast (41,03 -> 42,28); its own, faster script (SkillScript_B1_S2)
          # Dodge at 1,13, the earliest that keeps every hit. The CD starts at the dodge (user), and autos resume 0,11 later (39,25 -> 40,06).
          dodge_cancel: {at: 1.433, duration: 1.8}
          starts_cd: skill         # user: the skill CD only starts once the recast finishes
          skill_id: 10331030       # the recast skill row
          # Its own rows, for a first cast that triggered a Mark (user's clips: both big hits equal, 10109 and 12801, against volley hits of 7454 and 10408 = 22.7% / 17%).
          # With no Mark: 106% big hits (103303004; 13091 / 2106) and no bonus, not modelled, since in these teams the first cast always triggers one.
          # mult: Precise Temperature Control's +65% DMG Multiplier (EAT 85), separate from the DMG bucket.
          hits:
            - {hit: 103303001, count: 1, offset: 0.167, mult: 1.65, tags: [fj, recast], triggers_mark: true}
            - {hit: 103303001, count: 1, offset: 0.7, mult: 1.65, tags: [fj, recast], triggers_mark: true}
            - {hit: 103303003, count: 2, offset: 1.3, interval: 0, mult: 1.65, tags: [fj, recast], triggers_mark: true}
            - {hit: 103303003, count: 2, offset: 1.333, interval: 0, mult: 1.65, tags: [fj, recast], triggers_mark: true}
            - {hit: 103303003, count: 2, offset: 1.367, interval: 0, mult: 1.65, tags: [fj, recast], triggers_mark: true}
            - {hit: 103303003, count: 2, offset: 1.4, interval: 0, mult: 1.65, tags: [fj, recast], triggers_mark: true}
      overrides:
        - {index: 0, drop: true}   # the +65% is the hits' mult above
      note: "Recast after every skill. Both casts are dodged right after their last hit; the skill CD starts at the recast's dodge. Its rows and +65% assume the first cast triggered a Mark."

    510304:   # Echo of Hospitality (pink): extra hit per Fireworks Jam hit, max 5/s
      procs:
        - {event: "hit:self:fj", hit: 103304001, icd: 0.2, tags: [echo]}

    510305:   # Greed Gunfire: N Crit Hits -> full reload + Auto DMG, ICD
      overrides:
        - {index: 0, event: "hit:self:auto", icd: {ref: "ScriptParameterValue,NoLevel,10350511,CommonData,10K"}, hit_tags: [auto]}
      note: "Fires on the first auto after its ICD (the crit count is reached within ~2 s). The free reload is not modelled."

    510306:   # Ardent Trigger: each Auto DMG hit stacks Auto DMG; resets on reload
      overrides:
        - {index: 0, hit_tags: [auto], event: "hit:self:auto", duration: inf, max_stacks: {ref: "ScriptParameterValue,NoLevel,10306011,CommonData,10K"},
           reset_on: ["hit:self:mag_end", "cast:self:any"]}

    510307:   # Confident Mode: after skill, ATK SPD + Auto DMG
      overrides:
        # User, frame-timed: 12 shots take 60 frames (2,26 -> 4,26), and 43 after the skill (12,26 -> 14,09): +39.5%. The text says 35%, and the user sees no other ATK SPD source. The video is 29.97 fps and the game 60 fps, so a frame off is possible.
        - {index: 0, event: "cast:self:skill|cast:self:recast", value: 0.395}
        - {index: 1, event: "cast:self:skill|cast:self:recast", hit_tags: [auto]}
        - {index: 2, drop: true}                                    # name-only row (Param4), duplicate
      note: "ATK SPD from the user's frame timing (+39.5%, text 35%). It speeds up the shots (timed) and the reload (GUESS)."

    510308:   # Weakness Mark: skill cast -> ATK, stacking
      overrides:
        - {index: 0, event: "cast:self:skill|cast:self:recast"}

    510309:   # Grand Finale: Fireworks Jam Skill DMG + 2 extra rounds
      # User, frame by frame (2026-11-06): the 2 extra rounds are big hits at 0,12 and 1,01 of the first cast. The recast doesn't get them.
      add_hits:
        skill:
          - {hit: 103310002, count: 1, offset: 0.4, tags: [fj], triggers_mark: true}
          - {hit: 103310002, count: 1, offset: 1.033, tags: [fj], triggers_mark: true}
      overrides:
        - {index: 0, hit_tags: [fj]}
      note: "Hit counts from a frame-by-frame look: first cast 2 + 2 big + 8 small, recast 1 + 1 big + 8 small. The recast's Skill DMG bonus is still applied."

    510310:   # Spectacular Finale: needs kills (none vs a single boss)
      overrides:
        - {index: 0, drop: true}
      note: "Needs kills; worth nothing against a single boss."

    510311:   # Fiery Rhythm: DMG to elite/boss -> ATK, ICD
      overrides:
        - {index: 0, event: "hit:self:any", icd: {ref: "ScriptParameterValue,NoLevel,10351111,CommonData,10K"}}

    510312:   # Blazing Waltz: ATK while moving
      overrides:
        - {index: 0, hit_tags: [], event: "while:not:in_action:0:ult"}   # user: she can keep moving, stopping only for her ult
      note: "Always moving except during her ult (user)."

    510313:   # Keen Accent: Crit Hit on a Sacred Flame target -> ATK, stacking
      overrides:
        - {index: 0, event: "hit:self:any"}
      note: "Assumes the target has Sacred Flame and Amber crits often enough to keep stacks up."

    510341:   # Bursting Spark: ult -> ATK
      overrides:
        - {index: 0, event: "cast:self:ult"}

    510342:   # Overloaded Spark: ult resets skill CD; for a while after, skill CD -50% and Skill DMG
      reset_cd: {ult: skill}
      # 8 s after the ult ends (Param1), and its lock is 1.167 s. User: ult, skill, recast, and the CD is 4 s instead of 8.
      cd_when:
        - {action: skill, scale: 0.5, when: "while:cast_within:self:ult:9.167"}
      overrides:
        - {index: 0, event: "while:cast_within:self:ult:9.167"}
      note: "A skill CD starting within 8 s after the ult ends is halved. With the recast, that is one CD per ult (user). Without it, the sim can halve more than one (untested, GUESS)."

    510343:   # Soul-Hunting Spark: after the ult hits (no kill), Ignis DMG vs that target
      overrides:
        - {index: 0, hit_tags: [], event: "hit:self:ult", duration: {ref: "BuffValue,NoLevel,10354311,Time,10K"}}
      note: "Kill bonus ignored (single boss)."

support:
  timing: frames   # animation frame data (python -m ssr.inspect frames 103), not checked in game; the ult's hit is user-timed (main role)
  on_field: {skill: 4.0, ult: 2.7}   # frames: clip + the usual exit (docs/assumptions.md "Frame data")
  mark: {hit: 103000001}             # text: Bullet Waltz can trigger Ignis Mark
  actions:
    skill:                         # Bullet Waltz
      hits:
        - {hit: 103320001, count: 9, offset: 0.3, interval: 0.167, tags: [waltz], triggers_mark: true}   # frames: a 0.3-1.63 s hitbox, every 0.167 s
    ult:
      hits:
        - {hit: 103400001, offset: 0.5, tags: [ult], triggers_mark: true}
        - {hit: 0, offset: 0.6, tags: [ult_done]}

  potentials:
    510321:   # Hunting Waltz (pink): 6 s of following (text); frames: a hit every 0.367 s from +0.78
      add_hits:
        skill: [{hit: 103521001, count: 16, offset: 0.778, interval: 0.367, tags: [waltz_shot]}]
    510322:   # Scattering Waltz (pink): 2 Shadows every 2 s for 6 s, each every 0.25 s for 2.5 s
      add_hits:
        skill: [{hit: 103525001, count: 60, offset: 2.0, interval: 0.1, tags: [shadow]}]
    510323:   # Echoing Waltz (pink): 20% chance of a second cast
      procs:
        - {event: "cast:self:skill", hit: 103320001, chance: 0.2, offset: 1.5, tags: [waltz], triggers_mark: true}
    510324:   # Flame Waltz (pink)
      add_hits:
        skill: [{hit: 103524001, offset: 1.966, tags: [waltz_end]}]   # frames: the end shot follows the skill clip (1.433 + 0.533)
    510325:   # Nimble Catwalk
      overrides:
        - {index: 0, hit_tags: [waltz]}
    510326:   # Crescendo Beat: every 4 s during a single hit: nothing
      overrides:
        - {index: 0, drop: true}
    510327:   # Bullet Echoes
      overrides:
        - {index: 0, event: "cast:self:skill", icd: 14}
    510328:   # Lingering Gunfire: 10 stacks, one lost per second
      overrides:
        - {index: 0, event: "cast:self:skill", max_stacks: 1, copies: [{duration: 1}, {duration: 2}, {duration: 3}, {duration: 4}, {duration: 5}, {duration: 6}, {duration: 7}, {duration: 8}, {duration: 9}, {duration: 10}]}
    510329:   # Blazing Dance
      overrides:
        - {index: 0, event: "cast:self:skill"}
    510330:   # Sky Splitter
      overrides:
        - {index: 0, event: "damage:self&while:mark:2", icd: 2, reset_on: ["marker:self:ult_done"]}
    510331: {}   # Trajectory Enhancement
    510332: {}   # Pressure Amp
    510333:   # Thermal Sync
      overrides:
        - {index: 0, event: always, target: "element:2"}
    510341:   # Bursting Spark
      overrides:
        - {index: 0, event: "cast:self:ult"}
    510342:   # Overloaded Spark
      reset_cd: {ult: skill}
      cd_when:
        - {action: skill, scale: 0.5, when: "while:cast_within:self:ult:9.5"}
      overrides:
        - {index: 0, event: "while:cast_within:self:ult:9.5"}
    510343:   # Soul-Hunting Spark
      overrides:
        - {index: 0, hit_tags: [], event: "hit:self:ult", duration: {ref: "BuffValue,NoLevel,10354311,Time,10K"}}
