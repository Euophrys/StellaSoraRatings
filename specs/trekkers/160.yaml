# Suntide Willow (160) — Aqua Support. Hits scale with ATK (data).
# UNTIMED: conservative guesses, see docs/assumptions.md "Untimed kits".
# Main: Decibels come from autos: about 3/s at 13 per string, so 100 takes about 33 s. The first cast at 1 s does nothing
# and the next ones launch the Bubble Frog, once per 34 s (cd_start). GUESS: the Frog lasts 12 s, 4 bounces.
# Support: on the field for her 17 s of bubbles (text), GUESS: a bubble per second, so 2 Decibels per second: Safety Alert
# (over 40) from her second cast on.
char_id: 160

talents:
  1600116:   # Holiday Time (T1)
    buffs:
      - {effect: 16096111, event: "mark_applied:self", target: team, duration: {ref: "BuffValue,NoLevel,16096111,Time,10K"}}
  1600232:   # Heart Unsettled (T2): the faster Bubble Bath isn't modelled
    buffs:
      - {effect: 16096211, event: "mark:element1", target: enemy, duration: {ref: "BuffValue,NoLevel,16096211,Time,10K"}}
  1600348:   # Wisdom in Restraint (T3)
    buffs:
      - {effect: 16096311, event: "damage:any&while:mark:1", target: team, duration: {ref: "BuffValue,NoLevel,16096311,Time,10K"}}
  1600464:   # Going with the Flow (T4): 3 steps of 6%
    buffs:
      - {effect: 16096411, event: "timer:1", icd: {ref: "ScriptParameterValue,NoLevel,16096411,CommonData,10K"}, target: main, max_stacks: 3}
      - {effect: 16096412, event: "timer:1", icd: {ref: "ScriptParameterValue,NoLevel,16096411,CommonData,10K"}, target: main, max_stacks: 3}
  1600580:   # Reset and Restart (T5)
    buffs:
      - {effect: 16096511, event: "hit:self:skill_dmg", target: enemy, duration: {ref: "BuffValue,NoLevel,16096511,Time,10K"}}

main:
  untimed: true

  actions:
    auto:                          # Bubble Machine by default, Megaphone with a Megaphone pink; "multiple times" is counted once
      duration: 4.4                # GUESS: 1 s per strike
      hits:
        - {hit: 160100001, count: 3, offset: 0.4, interval: 1.0, tags: [bubble_auto], excludes: [516003, 516004]}
        - {hit: 160100002, offset: 3.4, tags: [bubble_auto], excludes: [516003, 516004]}
        - {hit: 160100006, count: 3, offset: 0.4, interval: 1.0, tags: [megaphone], requires: [516003]}
        - {hit: 160100007, offset: 3.4, tags: [megaphone], requires: [516003]}
        - {hit: 160100006, count: 3, offset: 0.4, interval: 1.0, tags: [megaphone], requires: [516004], excludes: [516003]}
        - {hit: 160100007, offset: 3.4, tags: [megaphone], requires: [516004], excludes: [516003]}

    skill:                         # Luminous Leaper at 100 Decibels: the Bubble Frog
      lock: 0.5                    # GUESS
      cd_start: 33.0               # GUESS: the time to 100 Decibels
      hits:
        - {hit: 160310001, count: 4, offset: 1.0, interval: 3.0, tags: [frog], applies_mark: true, from_cast: 2}

    ult:                           # Beach Warning x7 and a big hit (text)
      lock: 4.5                    # GUESS
      hits:
        - {hit: 160400001, count: 7, offset: 1.0, interval: 0.3, tags: [beach], applies_mark: true}
        - {hit: 160400002, offset: 3.5, tags: [beach], applies_mark: true}

  buffs:
    - {attribute: 16000010, level: auto, name: bubble_mark, event: "hit:self:bubble_auto", duration: {ref: "BuffValue,NoLevel,16000010,Time,10K"}, target: enemy}
    - {effect: 16093001, level: skill, event: "hit:self:frog", target: team, duration: {ref: "BuffValue,NoLevel,16093011,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,16093011,LaminatedNum,Fixed"}}
    - {effect: 16094001, level: ult, event: "cast:self:ult", target: team, duration: {ref: "BuffValue,NoLevel,16094011,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,16094011,LaminatedNum,Fixed"}}

  potentials:
    516001:   # Bubble Flurry (pink): GUESS: 5 bubbles absorbed per Frog
      overrides:
        - {index: 0, hit_tags: [frog], stacks: 5}
    516002:   # Rippling Radiance (pink): per second of the Frog's 12 s
      procs:
        - {event: "hit:self:frog", hit: 160502001, count: 3, offset: 0.5, interval: 1.0, tags: [ripple], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:ripple"}
    516003:   # Rhythmic Bubbles (pink): bounces twice as often; the extra Decibels aren't modelled
      procs:
        - {event: "hit:self:frog", hit: 160310001, offset: 1.5, tags: [frog_extra], applies_mark: true}
      overrides:
        - {index: 0, hit_tags: [frog, frog_extra]}
    516004:   # Rainbow Rebound (pink): 3 echoes per bounce
      procs:
        - {event: "hit:self:frog", hit: 160504001, count: 3, offset: 0.3, interval: 0.3, tags: [echo], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:echo"}
    516005:   # Enduring Bubble
      overrides:
        - {index: 0, event: "hit:self:bubble_auto&while:status:bubble_mark|hit:self:frog&while:status:bubble_mark"}
    516006:   # Dreamlike Illusion
      overrides:
        - {index: 0, event: "mark:element1&while:status:bubble_mark|mark_applied:element1&while:status:bubble_mark", target: "element:1"}
    516007:   # Clustered Foam: GUESS: a bubble every 3 s
      procs:
        - {event: "timer:3", when: "while:status:bubble_mark", hit: 160507001, tags: [foam], applies_mark: true}
      overrides:
        - {index: 0, hit_tags: [], event: "while:status:bubble_mark", target: "element:1"}
    516008:   # Foam Echo
      overrides:
        - {index: 0, event: "hit:self:echo"}
    516009:   # Touch 'n' Bounce: the non-Aqua part isn't counted
      overrides:
        - {index: 0, event: "hit:self:frog", target: team}
        - {index: 1, drop: true}
    516010:   # Wavering Glow
      procs:
        - {event: "hit:self:frog", every: 2, hit: 160510001, tags: [wavering], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:wavering"}
    516011:   # Singing Shores
      overrides:
        - {index: 0, event: "dodge:main"}
    516012:   # Ocean Wanderer: a shield
      note: "A shield: no damage value."
    516013:   # Cumulus Drift: one more bounce; the Frog's 15 s
      add_hits:
        skill: [{hit: 160310001, offset: 13.0, tags: [frog], applies_mark: true, from_cast: 2}]
      overrides:
        - {index: 0, event: "hit:self:frog", duration: 3.5, target: team}
    516041: {}   # Tidal Warning: the extra Decibels aren't modelled
    516042:   # Shore Regulation
      overrides:
        - {index: 0, event: "cast:self:ult", target: team}
    516043:   # Marine Justice
      overrides:
        - {index: 0, event: "hit:self:beach"}

support:
  untimed: true
  on_field: {skill: 17.0, ult: 4.5}  # skill: text; ult: GUESS
  actions:
    skill:                         # Frolic in the Sea: the dive, the Bath every 3 s, bubbles for 17 s
      hits:
        - {hit: 160320001, offset: 0.8, tags: [dive], applies_mark: true}
        - {hit: 160320002, count: 6, offset: 1.0, interval: 3.0, tags: [bath], applies_mark: true}
        - {hit: 160320003, count: 17, offset: 1.0, interval: 1.0, tags: [bubble], applies_mark: true}
        - {hit: 0, offset: 0.0, tags: [safety_up], from_cast: 2}
    ult:
      hits:
        - {hit: 160400001, count: 7, offset: 1.0, interval: 0.3, tags: [beach], applies_mark: true}
        - {hit: 160400002, offset: 3.5, tags: [beach], applies_mark: true}

  buffs:
    - {effect: 16094001, level: ult, event: "cast:self:ult", target: team, duration: {ref: "BuffValue,NoLevel,16094011,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,16094011,LaminatedNum,Fixed"}}
    - {effect: 16000008, level: skill, event: "while:on_field:self", target: team}
    - {effect: 16000009, level: skill, name: safety, event: "marker:self:safety_up", duration: 17, target: team, excludes: [516021, 516023]}
    - {effect: 16000009, level: skill, name: safety, event: "cast:self:skill", duration: 17, target: team, requires: [516021]}
    - {effect: 16000009, level: skill, name: safety, event: "cast:self:skill", duration: 17, target: team, requires: [516023], excludes: [516021]}
    - {name: sanction, event: "hit:self:column|hit:self:jet", duration: 12, target: enemy}

  potentials:
    516021:   # Flying Droplets (pink): a column per 10 shots
      procs:
        - {event: "hit:self:bubble", every: 10, hit: 160521001, count: 3, offset: 0.1, interval: 0.1, tags: [column], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:column"}
    516022:   # Flooding Shore (pink): spends 40 Decibels per 20 shots
      procs:
        - {event: "hit:self:bubble", every: 20, hit: 160522001, count: 3, offset: 0.1, interval: 0.1, tags: [jet], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:jet"}
    516023:   # Rhythm Surge (pink): starts at 70, so Safety Alert at once; 100 Decibels per 25 shots
      overrides:
        - {index: 0, event: "hit:self:bubble", every: 25, target: team}
    516024:   # Thunderous Surf (pink): GUESS: only in Safety Alert
      overrides:
        - {index: 0, event: "hit:self:bubble&while:status:safety"}
        - {index: 1, hit_tags: [bubble], event: "while:status:safety"}
    516025:   # Words Unchanged
      overrides:
        - {index: 0, event: "hit:self:column|hit:self:jet|hit:self:dive", duration: 12, max_stacks: 7}
    516026:   # Hovering Gale: needs Smiling Sanction; the per-stack bonus isn't modelled
      procs:
        - {event: "mark:element1", when: "while:status:sanction", hit: 160526001, icd: 1.5, tags: [hovering], applies_mark: true}
      overrides:
        - {index: 0, drop: true}
    516027:   # Eternal Tide: while Gentle Warning: not in Safety Alert
      overrides:
        - {index: 0, event: "while:not:status:safety", target: team}
    516028:   # Engulfing Tide: while the Bath is up
      overrides:
        - {index: 0, event: "cast:self:skill", duration: 18, target: main}
    516029:   # Receding Echoes: Decibels spent
      overrides:
        - {index: 0, event: "hit:self:column|hit:self:jet", target: team}
    516030:   # Prismatic Bubbles: per 8 shots; red half of the time
      procs:
        - {event: "hit:self:bubble", every: 8, hit: 160530001, tags: [prismatic]}
      overrides:
        - {index: 0, event: "hit:self:prismatic", target: team}
        - {index: 1, event: "hit:self:prismatic", every: 2, target: main}
    516031:   # Prismatic Barrier: a shield
      note: "A shield: no damage value."
    516032:   # Tender Seas
      overrides:
        - {index: 0, event: "while:on_field:self", target: team}
    516033:   # Balmy Surf
      overrides:
        - {index: 0, target: team, max_stacks: 1, copies: [{event: "while:squad:1:1"}, {event: "while:squad:1:2"}, {event: "while:squad:1:3"}]}
    516041: {}
    516042:
      overrides:
        - {index: 0, event: "cast:self:ult", target: team}
    516043:
      overrides:
        - {index: 0, event: "hit:self:beach"}
