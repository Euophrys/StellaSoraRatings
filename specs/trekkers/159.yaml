# Springseek Coronis (159) — Terra Versatile. Hits scale with ATK (data).
# Timings from frame data (python -m ssr.inspect frames 159).
char_id: 159

talents:
  1590116:   # Guiding Lanterns (T1)
    buffs:
      - {effect: 15996111, event: "hit:self:skill_dmg", target: enemy, duration: {ref: "BuffValue,NoLevel,15996111,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,15996111,LaminatedNum,Fixed"}}
  1590232:   # Eternal Flame (T2)
    buffs:
      - {attribute: 15996211, event: "mark_applied:element3", duration: {ref: "BuffValue,NoLevel,15996211,Time,10K"}}
  1590348:   # Magical Touch (T3)
    buffs:
      - {effect: 15996311, event: "hit:self:ult_dmg", target: enemy, duration: {ref: "BuffValue,NoLevel,15996311,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,15996311,LaminatedNum,Fixed"}}
  1590464:   # Healing Auspice (T4)
    buffs:
      - {effect: 15996411, event: "cast:self:skill", duration: {ref: "BuffValue,NoLevel,15996411,Time,10K"}}
  1590580:   # Fresh Start (T5)
    buffs:
      - {attribute: 15996511, event: always}

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 159), not checked in game
  mark: {hit: 159000001}

  actions:
    auto:
      duration: 5.3                # frames: 5 strikes of 3 shots (combo-window end 0.9) + the reload's 0.8
      hits:                        # frames: shots at +0.167/0.417/0.667 of each strike, 0.075 s flight
        - {hit: 159100001, count: 3, offset: 0.242, interval: 0.25, tags: [needle]}
        - {hit: 159100001, count: 3, offset: 1.142, interval: 0.25, tags: [needle]}
        - {hit: 159100001, count: 3, offset: 2.042, interval: 0.25, tags: [needle]}
        - {hit: 159100001, count: 3, offset: 2.942, interval: 0.25, tags: [needle]}
        - {hit: 159100001, count: 3, offset: 3.842, interval: 0.25, tags: [needle]}

    skill:                         # Jade of Vitality; the Auspice's beam every 0.6 s for 8 s (text)
      lock: 1.067                  # frames: combo-window end
      cd_start: 1.067              # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 159310001, offset: 0.667, tags: [jade], triggers_mark: true}
        - {hit: 159310002, count: 13, offset: 1.367, interval: 0.6, tags: [beam], triggers_mark: true}   # frames: the Auspice appears +0.767; GUESS: first beam 0.6 s later

    ult:                           # Burst of Blaze: the vial, then shards x8 (text)
      lock: 2.136                  # frames: the cutscene clip's combo-window end
      hits:
        - {hit: 159400001, offset: 1.233, tags: [burst]}
        - {hit: 159400002, count: 8, offset: 1.817, interval: 0.09, tags: [burst]}   # frames: every 0.09 s; x8 (text)

  buffs:
    - {name: coronis_crystallized, event: "cast:self:skill", duration: 8}

  potentials:
    515901:   # Radiance of Auspice (pink): interval -25%
      add_hits:
        skill: [{hit: 159310002, count: 4, offset: 1.667, interval: 1.8, tags: [beam], triggers_mark: true}]
    515902:   # Reflection of Auspice (pink): a second Auspice and the link
      add_hits:
        skill:
          - {hit: 159310002, count: 13, offset: 1.467, interval: 0.6, tags: [beam], triggers_mark: true}
          - {hit: 159310201, count: 13, offset: 1.567, interval: 0.6, tags: [beam], triggers_mark: true}
    515903:   # Needle Shower (pink): the extra hit while Crystallized; the fire rate and bigger magazine aren't modelled
      procs:
        - {event: "hit:self:needle", when: "while:status:coronis_crystallized", hit: 159310301, tags: [crystal_bullet], triggers_mark: true}
    515904:   # Echo of Earth (pink): a pulse per 1.5 s, landing 2.5 s later
      procs:
        - {event: "cast:self:skill", hit: 159310402, count: 5, offset: 2.5, interval: 1.5, tags: [pulse], triggers_mark: true}
      overrides:
        - {index: 0, hit_tags: [pulse]}
    515905:   # Catalyst: the per-Auspice part isn't modelled
      overrides:
        - {index: 0, hit_tags: [beam]}
        - {index: 1, drop: true}
    515906:   # Exquisite Cut
      overrides:
        - {index: 0, hit_tags: [beam], event: "hit:self:auto_dmg", duration: 5, max_stacks: 6}
    515907: {}   # Jade Chime
    515908:   # Expanse: Everlasting Peace: she fights from range
      overrides:
        - {index: 1, hit_tags: []}
    515909:   # Inner Stagnation
      overrides:
        - {index: 0, event: "hit:self:auto_dmg"}
    515910: {}   # Fortune's Flow
    515911:   # Iridescent Robe
      mark_tags: [burst]
      overrides:
        - {index: 0, event: "mark:self"}
    515912:   # Omen Breaker
      overrides:
        - {index: 0, event: "dodge:main"}
    515913:   # Shifting Brilliance: while the beam is up
      overrides:
        - {index: 1, hit_tags: [needle], event: "while:status:coronis_crystallized"}
    515941:   # Dream Shock
      overrides:
        - {index: 0, hit_tags: []}
    515942:   # Lingering Grace: nearly always; Terra Supports shouldn't get it, a small overrate
      overrides:
        - {index: 1, hit_tags: [], target: "element:3"}
    515943:   # United Flame
      overrides:
        - {index: 0, hit_tags: [], event: "hit:self:ult_dmg", duration: 20, max_stacks: 6}

support:
  timing: frames   # animation frame data, not checked in game
  on_field: {skill: 3.02, ult: 3.98}   # frames: clips + the usual exit
  actions:
    skill:                         # Instant Blossom: 6 Rose and 1 Wither Vial, a tick per 0.8 s for 6 s (text); frames: thrown +0.3, GUESS 0.5 s flight, first tick 1 s after landing
      hits:
        - {hit: 159320001, count: 42, offset: 1.8, interval: 0.133, tags: [rose], applies_mark: true, excludes: [515923]}
        - {hit: 159320001, count: 28, offset: 1.8, interval: 0.2, tags: [rose], applies_mark: true, requires: [515923]}
        - {hit: 159320002, count: 7, offset: 1.8, interval: 0.8, tags: [wither], applies_mark: true, excludes: [515923]}
        - {hit: 159320002, count: 21, offset: 1.8, interval: 0.267, tags: [wither], applies_mark: true, requires: [515923]}
    ult:
      hits:
        - {hit: 159400001, offset: 1.233, tags: [burst], excludes: [515932]}
        - {hit: 159400001, offset: 1.233, tags: [burst], applies_mark: true, requires: [515932]}
        - {hit: 159400002, count: 8, offset: 1.817, interval: 0.09, tags: [burst]}

  procs:
    - {event: "hit:self:wither", every: 5, hit: 159320004, tags: [wither_burst]}   # Wither at 5 stacks

  buffs:
    - {name: earth_vein, event: "hit:self:rose", duration: 10, target: enemy, requires: [515927]}

  potentials:
    515921:   # Essence Extraction (pink): the first 3.5 s; and 6 hits as the vials expire
      add_hits:
        skill: [{hit: 159321101, count: 6, offset: 7.8, interval: 0.1, tags: [rose_end]}]
      overrides:
        - {index: 0, hit_tags: [rose], event: "cast:self:skill", duration: 3.5}
    515922:   # Vernal Breath (pink): per Terra Trekker; Rapid Bloom only moves the hits
      overrides:
        - {index: 0, hit_tags: [rose], max_stacks: 1, copies: [{event: "while:squad:3:1"}, {event: "while:squad:3:2"}, {event: "while:squad:3:3"}]}
    515923:   # Return to Earth (pink): 3 Wither, 4 Rose (hits above)
      overrides:
        - {index: 0, hit_tags: [wither], max_stacks: 1, copies: [{event: "while:squad:3:1"}, {event: "while:squad:3:2"}, {event: "while:squad:3:3"}]}
    515924:   # Lasting Aftertaste (pink): 50% longer
      add_hits:
        skill:
          - {hit: 159320001, count: 18, offset: 7.8, interval: 0.17, tags: [rose], applies_mark: true}
          - {hit: 159320002, count: 3, offset: 7.8, interval: 0.8, tags: [wither], applies_mark: true}
    515925:   # Perfect Touch: 6 Rose Vials
      overrides:
        - {index: 0, hit_tags: [rose], event: "cast:self:skill", duration: 7.8, stacks: 6}
    515926:   # Symptom Sight
      overrides:
        - {index: 0, event: "hit:self:rose"}
    515927:   # Reciprocity
      procs:
        - {event: "mark:element3", when: "while:status:earth_vein", hit: 159327101, tags: [reciprocity]}
    515928:   # Faded Splendor: one Wither Vial
      overrides:
        - {index: 0, hit_tags: [wither]}
    515929:   # Aromatic Room: while a vial is out
      overrides:
        - {index: 0, hit_tags: [], event: "cast:self:skill", duration: 7.8, target: "element:3"}
    515930:   # Waning Year: the per-stack bonus isn't modelled
      procs:
        - {event: "hit:self:wither", hit: 159330101, tags: [waning]}
      overrides:
        - {index: 0, drop: true}
    515931: {}   # Herbal Tempering
    515932: {}   # Flying Fire: the ult's Mark is in the hits above
    515933:   # Terra Chorus: all Terra
      overrides:
        - {index: 0, event: "hit:self:rose&while:squad:3:3"}
    515941:
      overrides:
        - {index: 0, hit_tags: []}
    515942:
      overrides:
        - {index: 1, hit_tags: [], target: "element:3"}
    515943:
      overrides:
        - {index: 0, hit_tags: [], event: "hit:self:ult_dmg", duration: 20, max_stacks: 6}
