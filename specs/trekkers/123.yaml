# Ann (123) — Ventus Support. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
char_id: 123

talents:   # key talents, unlocked by dupes (specs/README.md)
  1230116:   # Sigh of Storm (T1)
    buffs:
      - {effect: 12396111, event: "hit:self:ult_dmg", target: team, duration: {ref: "BuffValue,NoLevel,12396111,Time,10K"}}
  1230232:   # Rumbling Wind (T2)
    buffs:
      - {effect: 12396211, event: "mark_applied:self", target: team, duration: {ref: "BuffValue,NoLevel,12396211,Time,10K"}}
  # 1230348: The Watcher in the Rye (T3): not modelled, see docs/assumptions.md
  1230464:   # Rippling Crops (T4)
    buffs:
      - {effect: 12396411, event: "mark:element4", target: main, duration: {ref: "BuffValue,NoLevel,12396411,Time,10K"}}
  1230580:   # Ode to Earth (T5)
    buffs:
      - {effect: 12396511, event: "while:squad:4:3", target: team}
#
# User's friend, frame-timed at 30 fps (2026-11-03), tutorial build: Gale Bastion + Wind Banish.
#   skill (53,11): hits +0.77 and +0.83 ("again with bigger numbers"); Wind Banish pulses +2.83, +3.83 (1/s);
#     on the battlefield 9,27 -> 12,15 = 2.6 s.
#   ult (59,04): a buff on Noya +0.87 (shield, Overlord's Warcry), hit +0.97; leaves +3.07.

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 123), not checked in game; the ult's hit is user-timed (support role)
  # Bubble (a minion) is skipped, except what it gives: its squad ATK, and a Wind Burst (Skill DMG, inflicts Breeze) about every
  # 4 s: 25% per Bubble hit, once per second at most. Bubble lasts 15 s (Word 4013), the skill's CD.

  actions:
    auto:                          # Coco the Firefang: Auto Attack DMG, not Minion DMG
      duration: 2.796              # frames: strikes chained at each combo-window end
      hits:
        - {hit: 123100001, offset: 0.302}
        - {hit: 123100002, offset: 0.87}
        - {hit: 123100003, count: 2, offset: 1.429, interval: 0.2}   # x2 (text); frames: a moving area, 1st hit +1.429; spacing GUESS
        - {hit: 123100004, offset: 2.363}

    skill:                         # Puffloon Spits
      lock: 0.917                  # frames: B1 combo-window end
      cd_start: 0.917              # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 123310004, count: 3, offset: 4.0, interval: 4.0, tags: [burst], applies_mark: true}

    ult:                           # Call of the Wild
      lock: 1.0                    # frames: combo-window end (the support role's 3.067 s on the field includes leaving)
      hits:
        - {hit: 123300001, offset: 0.967, tags: [howl], applies_mark: true}   # user-timed (frames: 0.98)

  buffs:
    - {effect: 12393001, level: skill, event: "cast:self:skill", duration: 15, target: team}

  potentials:
    512301:   # Wind's Breath (pink)
      procs:
        - {event: "hit:self:auto_dmg", hit: 123310004, chance: 0.25, icd: 1, offset: 0.1, tags: [burst], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:burst", target: team}
    512302:   # Stone Dust Tempest (pink)
      overrides:
        - {index: 0, event: "hit:self:burst"}
    512303:   # Dazzling Vortex (pink): Bubble
      note: "Bubble's hits aren't modelled."
    512304:   # Grand Debut (pink): the laser is Bubble's
      overrides:
        - {index: 0, event: "cast:self:skill", target: team}
    512305:   # Victorious Pursuit
      overrides:
        - {index: 0, event: "hit:self:burst", target: team}
    512306:   # Permeating Courage
      overrides:
        - {index: 0, drop: true}
        - {index: 1, event: "cast:self:skill", duration: 15}
    512307:   # Wind Chime: 46%, not 25%: about 2 more per cast
      add_hits:
        skill: [{hit: 123310004, count: 2, offset: 6.0, interval: 4.0, tags: [burst], applies_mark: true}]
    512308:   # Wind Surge: GUESS: the main is the ally
      overrides:
        - {index: 0, event: "cast:support:skill", target: main}
    512309:   # Breeze Caress: healing
      note: "Healing; no damage value."
    512310:   # Smooth Rotation: only for Marks a squadmate triggers; the CD cut isn't modelled
      note: "The cooldown cut isn't modelled."
    512311:   # Tall Tree Attracts Wind: DEF
      overrides:
        - {index: 0, drop: true}
    512312:   # Wind's Track: needs a barrier
      overrides:
        - {index: 0, drop: true}
    512313:   # Zephyr Caress
      procs:
        - {event: "dodge:main", hit: 123310004, count: 2, offset: 0.1, interval: 0.1, tags: [burst], applies_mark: true}
      overrides:
        - {index: 0, event: "dodge:main", target: team}
    512341:   # Overlord's Warcry: a shield
      note: "A shield: no damage value."
    512342:   # Mountain's Entice
      overrides:
        - {index: 0, event: always}
    512343:   # Impulsive Devourer: needs hostile projectiles
      note: "Depends on the boss; not modelled."

support:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits
  on_field: {skill: 2.6, ult: 3.067}   # user-timed
  actions:
    skill:                         # Wind Barrier: a wall of wind for 8 s that keeps inflicting Breeze
      hits:
        - {hit: 123320001, count: 1, offset: 0.767, tags: [barrier], applies_mark: true}
        # Breeze from the wall, no damage: GUESS once per second while it stands
        - {hit: 0, count: 8, offset: 1.0, interval: 1.0, tags: [wall_tick], applies_mark: true}
    ult:                           # Call of the Wild
      hits:
        - {hit: 123300001, count: 1, offset: 0.967, tags: [howl], applies_mark: true}

  buffs:
    - effect: 12393005             # Wind Barrier cast: squad ATK (skill level), 15 s
      level: skill
      event: "cast:self:skill"
      duration: {ref: "BuffValue,NoLevel,12393015,Time,10K"}
      target: team
    - name: wall                   # a wall of wind is on the battlefield (8 s, text)
      level: skill
      event: "cast:self:skill"
      duration: 8.8                # 8 s from when it appears (~+0.8)
      target: self

  potentials:
    512321:   # Gale Bastion (pink): 2 more walls
      add_hits:
        skill: [{hit: 123320001, count: 2, offset: 0.833, interval: 0.0, tags: [barrier], applies_mark: true}]   # GUESS: each wall deals the cast hit (user: a 2nd, bigger number at +0.83)
      note: "Assumes all 3 walls hit the boss."

    512322:   # Warm Wind Guard (pink): main passes through the wall -> ATK 4 s, 2 s ICD
      overrides:
        - {index: 0, event: "while:status:wall", target: main}
      note: "Assumes the main is in the wall whenever one stands."

    512323:   # Wind Banish (pink): the wall pulses AoE Skill DMG; each pulse -> Ventus DMG Taken 6 s
      add_hits:
        skill:
          - {hit: 123320002, count: 8, offset: 2.833, interval: 1.0, tags: [banish], applies_mark: true}                         # user: 8 pulses, +2.83, 1/s
          - {hit: 123320002, count: 8, offset: 2.833, interval: 1.0, mult: 2.0, tags: [banish], applies_mark: true, requires: [512321]}   # GUESS: the 2 extra walls pulse too
      overrides:
        - {index: 0, event: "hit:self:banish", target: enemy}

    512324:   # Downwind Journey (pink): main's projectiles through the wall
      overrides:
        - {index: 0, event: "while:status:wall", target: main, hit_tags: [projectile]}   # GUESS: every projectile passes through while a wall stands
      note: "Hits tagged projectile (Nanoha's autos and shurikens), while a wall stands. Assumes each one passes through it, so this is an upper bound."

    512325:   # Burdening Pressure: lowers the target's ATK (defensive)
      overrides:
        - {index: 0, drop: true}
      note: "Defensive; no damage value."

    512326:   # Windgate Barrier: skill cast -> main's ATK 15 s
      overrides:
        - {index: 0, event: "cast:self:skill", target: main}

    512327:   # Leveraged Boost: wall blocks projectiles -> main's ATK
      overrides:
        - {index: 0, drop: true}
      note: "Needs the boss to fire projectiles into the wall; assumed never."

    512328:   # Turbulent Flow: Wind Barrier DMG -> Ventus DMG Taken, 2 stacks, 8 s
      overrides:
        - {index: 0, event: "hit:self:skill_dmg", target: enemy}

    512330:   # Wind Erosion Havoc: targets near the wall take more Ventus DMG
      overrides:
        - {index: 0, event: "while:status:wall", target: enemy}

    512331:   # Storm Repel: Wind Barrier Skill DMG
      overrides:
        - {index: 0, hit_tags: []}

    512332:   # Violent Current: main's ATK while a wall stands
      overrides:
        - {index: 0, event: "while:status:wall", target: main}

    512329:   # Speed Surge: main passes through the wall -> ATK SPD + Ventus DMG 5 s
      overrides:
        - {index: 0, event: "while:status:wall", target: main}
        - {index: 1, event: "while:status:wall", target: main}
      note: "Assumes the main is in the wall whenever one stands."

    512333:   # Forest Princess' Blessing: 35% chance a random ally gets Ventus DMG
      overrides:
        - {index: 0, hit_tags: [], event: unknown, uptime: 0.117, target: main}
      note: "GUESS: 35% x 1/3 (random ally) as the main's expected uptime."

    512341:   # Overlord's Warcry: shield
      note: "Shield; no damage value."

    512342:   # Mountain's Entice: Ann's Ultimate DMG (always on)
      overrides:
        - {index: 0, event: always}

    512343:   # Impulsive Devourer: energy when the ult blocks projectiles
      note: "Needs projectiles; not modelled."
