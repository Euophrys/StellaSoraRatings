# Snowish Laru (158) — Ignis. Hits scale with ATK (data).
# Schema: specs/README.md. Every guessed number is marked GUESS.
# Summon hits (Colonel Walnut, General Curly) are HitDamage DamageType 7 = Minion DMG.
char_id: 158

talents:   # key talents, unlocked by dupes (specs/README.md)
  1580116:   # Nutcracker (T1): toys spawn with each shell and live ~13.5 s (kit header)
    buffs:
      - {event: "hit:self:shell", duration: 13.5, name: toys}
      - {effect: 15896111, event: "while:status:toys", target: "element:2"}
  1580232:   # Holy Night Gift (T2)
    buffs:
      - {effect: 15896211, event: "mark:element2", duration: {ref: "BuffValue,NoLevel,15896221,Time,10K"}}
      - {effect: 15896221, event: "mark:element2", duration: {ref: "BuffValue,NoLevel,15896221,Time,10K"}}
  1580348:   # Block Paradise (T3)
    buffs:
      - {attribute: 15896511, event: always, minions: true}
  # 1580464: Queen's Party (T4): not modelled, see docs/assumptions.md
  1580580:   # Dreams Replayed (T5): does nothing until the ult is authored, which only matters with Fuyuka as main (docs/assumptions.md)
    buffs:
      - {effect: 15896311, event: "cast:self:ult", target: "element:2", duration: {ref: "BuffValue,NoLevel,15896311,Time,10K"}}

main:
  timing: frames   # animation frame data (python -m ssr.inspect frames 158), not checked in game
  # Colonel Walnut, General Curly and the Clockwork Queen (minions) are skipped, and they're most of her main-role damage:
  # expect a very low total until they're modelled. Dame Laru deals Ultimate DMG, so she's modelled.
  mark: {hit: 158000001}

  actions:
    auto:
      duration: 3.799              # frames: strikes chained at each combo-window end
      hits:
        - {hit: 158100001, offset: 0.25}
        - {hit: 158100002, offset: 0.767}
        - {hit: 158100003, offset: 1.3}
        - {hit: 158100004, count: 5, offset: 1.8, interval: 0.167}
        - {hit: 158100005, count: 3, offset: 2.616, interval: 0.275}

    skill:                         # Whip Assault
      lock: 1.044                  # frames: combo-window end
      cd_start: 1.044              # GUESS: the CD starts when the cast ends
      hits:
        - {hit: 158310001, offset: 0.889, tags: [whip], triggers_mark: true}

    ult:                           # Sweet Dream Waltz: Dame Laru for 12 s; Candy Barrage x5 every 4 s (text)
      # frames: transforms at the cutscene's combo-window end (0.32); then Candy Barrage (combo end 1.0; its area hits
      # +2.333, every 0.25 s) and 3 shots (one per 1.067 s, +0.267 and 0.075 s flight) until the barrage is ready again
      lock: 13.153                 # frames: 0.32 + the 12 s form (text) + the end clip's combo-window end 0.833
      hits:
        - {hit: 158400002, count: 3, offset: 1.662, interval: 1.067, tags: [shot]}
        - {hit: 158400002, count: 3, offset: 5.862, interval: 1.067, tags: [shot]}
        - {hit: 158400002, count: 3, offset: 10.062, interval: 1.067, tags: [shot]}
        - {hit: 158400003, count: 5, offset: 2.653, interval: 0.25, tags: [barrage]}
        - {hit: 158400003, count: 5, offset: 6.853, interval: 0.25, tags: [barrage]}
        - {hit: 158400003, count: 5, offset: 11.053, interval: 0.25, tags: [barrage]}

  potentials:
    515801:   # Solemn Look (pink): the toys
      note: "The toys aren't modelled."
    515802:   # Here Comes the Queen (pink): the toys
      note: "The toys aren't modelled."
    515803:   # Whipping Gale (pink): a multi-hit whip
      replace_hits:
        skill: [{hit: 158503001, count: 5, offset: 0.333, interval: 0.25, tags: [whip], triggers_mark: true}]   # frames: its own clip (combo end 1.667, longer than the lock; not modelled)
    515804:   # Crossing Welts (pink): the mark comes from the toys
      note: "The toys aren't modelled."
    515805:   # Burning Whip: the toys
      overrides:
        - {index: 0, drop: true}
    515806:   # Starchain Blade: the toys
      note: "The toys aren't modelled."
    515807:   # Fiery Rainbow: the toys
      overrides:
        - {index: 0, drop: true}
        - {index: 1, drop: true}
    515808:   # All-Out Whiplash: crits as every 2nd hit (GUESS: 50% Crit Rate)
      overrides:
        - {index: 0, event: "hit:self:whip|hit:self:barrage", every: 2}
    515809:   # Wild Whip Waltz
      overrides:
        - {index: 0, drop: true}   # duplicate Lv1 row
        - {index: 1, hit_tags: [whip, barrage]}
    515810:   # Non-Stop Victory: crits as every 2nd hit
      overrides:
        - {index: 0, event: "hit:self:auto_dmg", every: 2}
    515811:   # Cannon Ensemble: the Sled Turret
      overrides:
        - {index: 0, drop: true}
    515812:   # Jazz of Rage
      mark_tags: [shot, barrage]
      overrides:
        - {index: 0, event: always}
    515813:   # Elegant Moves: DEF
      overrides:
        - {index: 0, drop: true}
    515841:   # Silver Bullet
      overrides:
        - {index: 0, event: "hit:self:barrage"}
    515842:   # Untouched King
      overrides:
        - {index: 0, event: "hit:self:barrage"}
    515843:   # Toy Army: GUESS: a stack per shot; gone with the 12 s form
      overrides:
        - {index: 0, event: "hit:self:shot", duration: 12, target: "element:2"}

