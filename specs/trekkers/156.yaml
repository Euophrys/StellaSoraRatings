# Nazuna (156) — Terra, Support class. Hits scale with ATK (data). No Mark hit of her own: she inflicts
# Terra Mark: Earth Vein; Gerie (or another Terra Mark triggerer) consumes it.
# Schema: specs/README.md. Every guessed number is marked GUESS.
#
# User, frame-timed 2026-11-03 (30 fps, ss,ff):
# MAIN (Small Force + Wobble Dance):
#   autos: magazine 6 (like Amber). String starts 27,04; shots 27,15 / 27,24 / 28,04 / 28,17 / 29,00 / 29,11;
#     reload, next string 30,15 (3.367 s period).
#   skill: cast 0,17; penguin out 1,02 (+0.5); its aura buffs Nazuna 1,19 (+1.067); penguin slams 5,02 (+4.5);
#     buffs lost 5,16 and 6,08.
#   ult: same as support. Skill cast 43,16 -> first bolt 44,19; ult cast 36,06 -> first bolt 39,29.
#   Raffles with Arrow of Affection (user video, 19 raffles): 10 HHH, 9 with 2 hearts + 1 penguin, 0 more penguins.
# SUPPORT (Arrow of Affection + Sweetheart Bloom):
#   skill: cast 4,18; raffle 1 (3 hearts) 5,24 (+1.2), Kiss of Love on Gerie 5,29; raffles at 9,20 / 13,17 / 17,13 /
#     21,11 (~3.89 s apart); leaves 24,05 (19.57 s on the battlefield). Another cast rolled 2 hearts + 1 penguin.
#   ult: cast 24,23; hits 24,26 / 25,02 / 25,08 / 25,14 ... last ~27,12 (11 hits over ~2.53 s); leaves 31,01 (6.27 s).
char_id: 156

talents:   # key talents, unlocked by dupes (specs/README.md)
  1560116:   # Blanket Home (T1)
    buffs:
      - {effect: 15696111, event: "mark:element3", target: team, duration: {ref: "BuffValue,NoLevel,15696111,Time,10K"}}
  1560232:   # Snack Summoning Circle (T2)
    buffs:
      - {attribute: 15696211, event: "hit:self:ult_dmg", target: main, duration: {ref: "BuffValue,NoLevel,15696211,Time,10K"}}
  1560348:   # Fluffy Guardian (T3)
    buffs:
      - {effect: 15696311, event: "mark_applied:self", target: enemy, duration: {ref: "BuffValue,NoLevel,15696311,Time,10K"}}
  1560464:   # Expert Homebody (T4)
    buffs:
      - {effect: 15696411, event: "hit:self:skill_dmg", target: main, duration: {ref: "BuffValue,NoLevel,15696411,Time,10K"}}
  1560580:   # Lullaby of Sweet Dreams (T5)
    buffs:
      - {effect: 15696511, event: "while:squad:3:3", target: team}

main:
  energy_per_second: 0.0          # user-tested 2026-11-03: no passive energy, all energy comes from hits

  actions:
    auto:                          # Laid-back Shots: 6 bolts, then a reload (user-timed)
      duration: 3.367
      hits:
        - {hit: 156100001, count: 1, offset: 0.367, tags: [auto, shot]}
        - {hit: 156100001, count: 1, offset: 0.667, tags: [auto, shot]}
        - {hit: 156100001, count: 1, offset: 1.000, tags: [auto, shot]}
        - {hit: 156100001, count: 1, offset: 1.433, tags: [auto, shot]}
        - {hit: 156100001, count: 1, offset: 1.867, tags: [auto, shot]}
        - {hit: 156100001, count: 1, offset: 2.233, tags: [auto, shot, mag_end]}

    skill:                         # Plushie Dance: penguin walks to the target and explodes
      lock: 0.733                  # user: cast 43,16 -> first bolt 44,19 (+1.1; first shot is 0.367 s into the string)
      hits:
        - {hit: 156310002, count: 1, offset: 4.5, tags: [penguin, boom], applies_mark: true}   # user: slam at +4.5 (with Small Force)

    ult:                           # Dream Spiral: 11 hits (text), cart explodes -> squad ATK 15 s
      lock: 3.4                    # user: cast 36,06 -> first bolt 39,29 (+3.767)
      hits:
        - {hit: 156400001, count: 11, offset: 0.1, interval: 0.253, tags: [ult], applies_mark: true}
        - {hit: 0, offset: 2.9, tags: [cart_boom]}                                                # GUESS: explodes as the spin ends

  buffs:
    - {name: penguin, event: "cast:self:skill", duration: 4.5}                               # penguin on the battlefield
    - {effect: 15690001, level: skill, event: "hit:self:penguin", duration: {ref: "BuffValue,NoLevel,15690011,Time,10K"}, target: enemy}   # target's Terra DMG Taken
    - {effect: 15694001, level: ult, event: "marker:self:cart_boom", duration: {ref: "BuffValue,NoLevel,15694011,Time,10K"}, target: team}

  potentials:
    515601:   # Small Force (pink): penguin hits -> target's Terra DMG Taken stacks
      overrides:
        - {index: 0, event: "hit:self:penguin", target: enemy}

    515602:   # Wobble Dance (pink): the penguin dances while walking, x11 small hits, inflicts Earth Vein; heals
      add_hits:
        skill: [{hit: 156310004, count: 11, offset: 1.067, interval: 0.31, tags: [penguin, wobble], applies_mark: true}]   # spread over the penguin's walk (GUESS)

    515603:   # Roll the Dice (pink): 30% (50% while the skill is on CD) to spend 2 ammo on 3 bolts
      procs:
        - {event: "hit:self:shot", hit: 156100001, mult: 0.31, offset: 0.05, tags: [auto, dice]}
      note: "Expected value: ~45% chance -> (1+2p)/(1+p) = 1.31 bolts per ammo. Time per magazine is unchanged (GUESS)."

    515604:   # Graceful Turn (pink): on reload, 6 tracking bolts (Earth Vein) + squad ATK 4 s
      procs:
        - {event: "hit:self:mag_end", hit: 156100002, count: 6, offset: 0.3, interval: 0.08, tags: [spin], applies_mark: true}
      overrides:
        - {index: 0, event: "hit:self:mag_end", target: team}

    515605:   # Cuddle of Terror: the penguin pounces when it stops; penguin Skill DMG
      overrides:
        - {index: 0, hit_tags: [penguin]}
      note: "The pounce is taken to be the explosion (no separate hit in data)."

    515606:   # Cutie's Rally: squad ATK while the penguin is out
      overrides:
        - {index: 0, event: "while:status:penguin", target: team}

    515607:   # Beat Maestro: reload -> Skill DMG stacks
      overrides:
        - {index: 0, event: "hit:self:mag_end"}

    515608:   # Clean Sweep: 20% per auto: golden egg (AoE Auto DMG, Earth Vein)
      procs:
        - {event: "hit:self:shot", hit: 156310005, chance: 0.2, offset: 0.2, tags: [egg], applies_mark: true}

    515609:   # Fill the Gap: reload -> Support Trekkers' Skill DMG stacks
      overrides:
        - {index: 0, event: "hit:self:mag_end", target: support}

    515611:   # Swiftstep: dodge -> squad ATK 2 s
      overrides:
        - {index: 0, event: "dodge:main", target: team}   # one dodge every `dodge_interval` s (user 2026-11-04: 10 s)
      note: "One dodge every 10 s (team assumption dodge_interval)."

    515613:   # Wily Wonder: skill cast -> squad Terra DMG 5 s
      overrides:
        - {index: 0, event: "cast:self:skill", target: team}

    515610:   # Focus Fire: squad ATK while Plushie Dance is on cooldown
      overrides:
        - {index: 0, event: unknown, uptime: 0.95, target: team}
      note: "Cast on cooldown, so it's nearly always on cooldown (95%)."

    515612:   # Touch of Nature: all Terra Trekkers' Mark DMG Multiplier
      overrides:
        - {index: 0, event: always, target: "element:3", as_stat: 85, hit_tags: [mark]}
      note: "Data says EAT 64 (Mark DMG), but it's a separate multiplier on Mark hits (EAT 85, x(1+value)), as its text says. User test 2026-11-13: Lv6 alone 32864, +33% Mark DMG emblem 43736 (x1.331; a shared bucket would give x1.063)."

    515641:   # Operation: Pandemonium: ult cast -> squad Skill Crit Rate 15 s
      overrides:
        - {index: 0, event: "cast:self:ult", target: team}

    515643:   # Rocket Cart: ult hits, 30% each -> target's Terra DMG Taken stacks
      overrides:
        - {index: 0, event: "hit:self:ult", every: 3, target: enemy}
      note: "30% per hit approximated as one stack every 3rd hit."

