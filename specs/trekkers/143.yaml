# Wraith (143) — Ventus Vanguard. Hits scale with ATK (data).
# Main: user-timed (2026-11-17). Support: timings from animation frame data, see docs/assumptions.md "Frame data".
char_id: 143

talents:
  1430116:   # Daybreak Trigger (T1)
    buffs:
      - {effect: 14396111, event: "mark:self", duration: {ref: "BuffValue,NoLevel,14396111,Time,10K"}}
      - {effect: 14396121, event: "mark:self", duration: {ref: "BuffValue,NoLevel,14396111,Time,10K"}}
  1430232:   # Righteous Judgment (T2)
    buffs:
      - {effect: 14396211, event: "hit:self:skill_dmg", duration: {ref: "BuffValue,NoLevel,14396211,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,14396211,LaminatedNum,Fixed"}}
  1430348:   # Silver Phantom (T3)
    buffs:
      - {effect: 14396311, event: "mark_applied:element4", duration: {ref: "BuffValue,NoLevel,14396311,Time,10K"}}
      - {effect: 14396321, event: "mark_applied:element4", duration: {ref: "BuffValue,NoLevel,14396311,Time,10K"}}
  1430464:   # Curtain Call (T4)
    buffs:
      - {effect: 14396411, event: "hit:self:auto_dmg", duration: {ref: "BuffValue,NoLevel,14396411,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,14396411,LaminatedNum,Fixed"}}
  1430580:   # Glorious Return to Norstheim (T5)
    buffs:
      - {attribute: 14396511, event: always}

main:
  # User-timed 2026-11-17 (both strings, the skill, the ult). She slashes nearby targets and shoots distant ones:
  # the default is the melee play (sword string). Storm-Piercing Surge / Wind-Splitting Bullet mean ranged play:
  # the gun string, and the skill's slashes miss (user: they only hit "in melee range").
  mark: {hit: 143000001, tags: [cyclone]}
  resources:
    gale: {max: 1}                 # Last Gasp of Gale armed by a cast
  procs:
    - {event: "mark:self", hit: 143000001, count: 2, offset: 0.1, interval: 0.1, tags: [cyclone]}   # Cyclone x3 (text)

  actions:
    auto:                          # sword string (user): 13 hits, next string's first hit 4.333 s after this one's
      duration: 4.333
      hits:
        - {hit: 143100003, offset: 0.2, tags: [slash]}     # frames: first hit 0.2 s into the clip
        - {hit: 143100004, offset: 0.567, tags: [slash]}
        - {hit: 143100005, offset: 1.067, tags: [slash]}
        - {hit: 143100005, offset: 1.233, tags: [slash]}
        - {hit: 143100005, offset: 1.433, tags: [slash]}
        - {hit: 143100006, offset: 1.667, tags: [slash]}
        - {hit: 143100006, offset: 1.833, tags: [slash]}
        - {hit: 143100006, offset: 2.033, tags: [slash]}
        - {hit: 143100006, offset: 2.3, tags: [slash]}
        - {hit: 143100007, offset: 2.767, tags: [slash]}   # the stab
        - {hit: 143100007, offset: 2.933, tags: [slash]}
        - {hit: 143100007, offset: 3.1, tags: [slash]}
        - {hit: 143100008, offset: 3.767, tags: [slash]}   # the energy crescent

    skill:                         # Whirling Onslaught: slashes x4 and bullets x4; 3 uses (data)
      lock: 0.777                  # frames: start 0.2 + loop 0.4 + end's combo-window end 0.177
      hits:
        - {hit: 143300001, offset: 0.267, tags: [spin], triggers_mark: true, excludes: [514303]}   # user: slashes +0.267 .. +0.567
        - {hit: 143300001, offset: 0.333, tags: [spin], triggers_mark: true, excludes: [514303]}
        - {hit: 143300001, offset: 0.433, tags: [spin], triggers_mark: true, excludes: [514303]}
        - {hit: 143300001, offset: 0.567, tags: [spin], triggers_mark: true, excludes: [514303]}
        - {hit: 143300002, count: 4, offset: 0.32, interval: 0.095, tags: [shot], triggers_mark: true, excludes: [514303]}   # frames; user: all 4 seem to hit at point blank
        - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true, requires: [514303]}   # user: Storm-Piercing's lasers +0.233 .. +0.533

    ult:                           # Thousand Shade Dance x27 and the detonation (text)
      lock: 4.0                    # user: next auto lands +4.2
      hits:
        - {hit: 143400001, count: 27, offset: 0.833, interval: 0.0705, tags: [shade], triggers_mark: true}   # user: +0.833 .. +2.667
        - {hit: 143400002, offset: 3.1, tags: [shade], triggers_mark: true}                                # user: the big hit

  buffs:
    - {name: enhanced, event: "cast:self:skill", duration: 3, requires: [514310], excludes: [514304]}
    - {name: enhanced, event: "cast:self:skill", duration: 9, requires_all: [514310, 514304]}   # a 3-use hold: 3 s + 3 s per extra use (text)

  potentials:
    514301:   # Last Gasp of Gale (pink): within 4 s of a cast, the next sword hit makes a Whirlwind, every 0.5 s for 4 s
      # (text). One per cast: the cast arms it, the first sword hit spends it. None in ranged play (no sword hits).
      procs:
        - {event: "cast:self:skill", hit: 0, gain: {gale: 1}}
        - {event: "hit:self:slash", when: "while:cast_within:self:skill:4", hit: 143300003, cost: {gale: 1}, count: 8, offset: 0, interval: 0.5, tags: [whirl], triggers_mark: true}   # GUESS: the first tick as it appears
    514302:   # Twin Shadows (pink): 2 Whirlwinds per use, every 0.5 s for 4 s (text). User: a 3-use hold makes 6, the first
      # seen +0.833 s after the cast, the last gone +5.867 s after it (the 3rd use's +0.867 + 0.833 + 4 s, within a few frames)
      procs:
        - {event: "cast:self:skill", hit: 143300003, count: 8, offset: 0.833, interval: 0.5, tags: [whirl], triggers_mark: true}
        - {event: "cast:self:skill", hit: 143300003, count: 8, offset: 0.833, interval: 0.5, tags: [whirl], triggers_mark: true}
    514303:   # Storm-Piercing Surge (pink): lasers instead of bullets (in the skill above); ranged play
      add_actions:
        auto: &gun_string
          # gun string (user): 6 hits, next string's first hit 3.133 s after this one's. Shots count as
          # "Wraith's shots" for Storm-Piercing / Wind-Splitting / Scorching Gale (GUESS: the text says shots, not skill shots)
          duration: 3.133
          hits:
            - {hit: 143100001, offset: 0.5, tags: [shot, tw_shot]}   # GUESS: frames fire at 0.467, plus a frame of flight
            - {hit: 143100001, offset: 0.933, tags: [shot]}
            - {hit: 143100001, offset: 1.5, tags: [shot]}
            - {hit: 143100001, offset: 2.1, tags: [shot, tw_shot]}
            - {hit: 143100001, offset: 2.2, tags: [shot]}
            - {hit: 143100002, offset: 2.567, tags: [shot]}            # the laser
      overrides:
        - {index: 0, hit_tags: [shot]}
    514304:   # Wind-Splitting Bullet (pink): holding, each round fires 4 more bullets; ranged play
      # Modelled as a held cast of all 3 uses (4 + 8 + 12 shots, user-timed), so the 3 uses recharge as a 9 s cooldown.
      # Rounds 2 and 3 are their own casts (`hold_2`, `hold_3`), each with the skill's energy cap.
      # User: holding all 3 uses is how she is played (twice the shots of 3 taps).
      add_actions:
        auto: *gun_string
        skill:
          skill_id: 14331000
          charges: 1
          lock: 0.4                # user: the rounds start 0.4 s apart (frames: the 0.4 s loop)
          hits:
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}   # user: round 1 +0.233 .. +0.533
        hold_2:
          skill_id: 14331000
          followup: {after: skill}
          lock: 0.4
          hits:
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}   # user: round 2, x2
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}
        hold_3:
          skill_id: 14331000
          followup: {after: hold_2}
          lock: 0.867              # user: first auto 2.167 s after the first round, minus the gun string's 0.5
          hits:
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}   # user: round 3, x3
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}
            - {hit: 143300002, count: 4, offset: 0.233, interval: 0.1, tags: [shot], triggers_mark: true}
      cd_scale: {skill: 3}
      overrides:
        - {index: 0, hit_tags: [shot]}
    514305:   # Zero Hour: nearby targets (her sword string)
      overrides:
        - {index: 0, hit_tags: [slash]}
    514306:   # Blade's Waltz
      overrides:
        - {index: 1, hit_tags: [spin]}
    514307:   # Rapid Draw
      overrides:
        - {index: 0, event: "hit:self:spin"}
    514308:   # Overheat Shot
      overrides:
        - {index: 0, hit_tags: [shot], event: "cast:self:skill|cast:self:hold_2|cast:self:hold_3", duration: 1, max_stacks: 3}
    514309:   # Scorching Gale
      overrides:
        - {index: 0, event: "hit:self:shot", icd: 1, reset_on: ["cast:self:skill", "cast:self:hold_2", "cast:self:hold_3"]}
    514310:   # Tracewind Blink: user: two lasers per gun string, with the 1st and 4th shots (the 3rd is exactly 1 s
      # after the 1st and doesn't get one, so the shots are tagged rather than using the ICD alone). None on the sword
      # string (user)
      procs:
        - {event: "hit:self:tw_shot", when: "while:status:enhanced", hit: 143300005, icd: 1.0, tags: [laser]}
    514311:   # Unseen Predator
      overrides:
        - {index: 0, event: "dodge:main"}
    514312:   # Dauntless Poise
      overrides:
        - {index: 0, max_stacks: 1, copies: [{event: "while:squad:4:1"}, {event: "while:squad:4:2"}, {event: "while:squad:4:3"}]}
    514313:   # Tempest Stance
      overrides:
        - {index: 0, event: "mark:self"}
    514341: {}   # Daybreaker
    514342:   # Raging Battle Will
      overrides:
        - {index: 0, event: "cast:self:ult"}
    514343: {}   # Tempest Siphon

support:
  timing: frames   # animation frame data, not checked in game
  on_field: {skill: 6.47, ult: 7.1}   # frames: clips + the usual exit
  mark: {hit: 143000001, tags: [cyclone]}   # text: Rolling Bungee can trigger Ventus Mark
  procs:
    - {event: "mark:self", hit: 143000001, count: 2, offset: 0.1, interval: 0.1, tags: [cyclone]}
  actions:
    skill:                         # Rolling Bungee: slashes x3, then the lasers
      hits:
        - {hit: 143310001, count: 3, offset: 0.483, interval: 0.15, tags: [bungee, slash_s], triggers_mark: true}   # frames
        - {hit: 143310002, offset: 2.534, tags: [bungee, laser], triggers_mark: true}                              # frames: the 2nd clip, +1.117
    ult:
      hits:
        - {hit: 143400001, count: 27, offset: 0.767, interval: 0.0545, tags: [shade], triggers_mark: true}   # frames: the domain's quick attacks span +0.767 .. +2.184
        - {hit: 143400002, offset: 3.167, tags: [shade], triggers_mark: true}                              # frames: the domain closes

  potentials:
    514321:   # Underbarrel Launcher (pink): every 0.5 s for 8 s
      add_hits:
        skill: [{hit: 143310004, count: 16, offset: 2.2, interval: 0.5, tags: [tornado], triggers_mark: true}]
    514322:   # Suppressive Wind-Splitting Round (pink): every 0.5 s for 8 s
      add_hits:
        skill: [{hit: 143310005, count: 16, offset: 1.5, interval: 0.5, tags: [rift], triggers_mark: true}]
    514323:   # Rotary Saw (pink)
      add_hits:
        skill: [{hit: 143310006, offset: 1.8, tags: [bungee, slash_s], triggers_mark: true}]
    514324:   # Enhanced Rapid-Fire Round (pink)
      add_hits:
        skill: [{hit: 143310002, count: 2, offset: 2.3, interval: 0.3, tags: [bungee, laser], triggers_mark: true}]
    514325:   # Ominous Vibe
      procs:
        - {event: "hit:self:bungee", hit: 143310008, chance: 0.5, tags: [vibe], triggers_mark: true}
    514326:   # Hunter's Instinct
      overrides:
        - {index: 0, event: "hit:self:bungee"}
    514327:   # Frost-Proof Constitution
      overrides:
        - {index: 0, event: "cast:self:skill"}
    514328:   # Warrior's Quality
      overrides:
        - {index: 0, hit_tags: [laser], event: "hit:self:slash_s", duration: inf, max_stacks: 9, reset_on: ["cast:self:skill"]}
    514329:   # Will of Vengeance
      overrides:
        - {index: 0, hit_tags: [bungee]}
    514330:   # Dawn's Embrace: one target: the higher value
      overrides:
        - {index: 0, drop: true}
        - {index: 1, hit_tags: [slash_s]}
    514331:   # Expatriate
      overrides:
        - {index: 0, hit_tags: [bungee], event: "while:mark:4"}
    514332:   # Avenger: every 0.5 s for 8 s
      procs:
        - {event: "mark:element4", hit: 143310007, chance: 0.5, icd: 3, count: 16, offset: 0.5, interval: 0.5, tags: [whirlwind]}
    514333:   # Flame Hunter
      overrides:
        - {index: 0, max_stacks: 1, copies: [{event: "while:squad:4:1"}, {event: "while:squad:4:2"}, {event: "while:squad:4:3"}]}
    514341: {}
    514342:
      overrides:
        - {index: 0, event: "cast:self:ult"}
    514343: {}
