# Wraith (143) — Ventus Vanguard. Hits scale with ATK (data).
# UNTIMED: conservative guesses, see docs/assumptions.md "Untimed kits". Her string is the close-range one.
char_id: 143

talents:
  1430116:   # Daybreak Trigger (T1)
    buffs:
      - {effect: 14396111, event: "mark:self", duration: {ref: "BuffValue,NoLevel,14396111,Time,10K"}}
      - {effect: 14396121, event: "mark:self", duration: {ref: "BuffValue,NoLevel,14396111,Time,10K"}}
  1430232:   # Righteous Judgment (T2)
    buffs:
      - {effect: 14396211, event: "hit:self:skill_dmg", duration: {ref: "BuffValue,NoLevel,14396211,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,14396211,LaminatedNum,Fixed"}}
  1430348:   # Silver Phantom (T3)
    buffs:
      - {effect: 14396311, event: "mark_applied:element4", duration: {ref: "BuffValue,NoLevel,14396311,Time,10K"}}
      - {effect: 14396321, event: "mark_applied:element4", duration: {ref: "BuffValue,NoLevel,14396311,Time,10K"}}
  1430464:   # Curtain Call (T4)
    buffs:
      - {effect: 14396411, event: "hit:self:auto_dmg", duration: {ref: "BuffValue,NoLevel,14396411,Time,10K"}, max_stacks: {ref: "BuffValue,NoLevel,14396411,LaminatedNum,Fixed"}}
  1430580:   # Glorious Return to Norstheim (T5)
    buffs:
      - {attribute: 14396511, event: always}

main:
  untimed: true
  mark: {hit: 143000001, tags: [cyclone]}
  procs:
    - {event: "mark:self", hit: 143000001, count: 2, offset: 0.1, interval: 0.1, tags: [cyclone]}   # Cyclone x3 (text)

  actions:
    auto:
      duration: 6.4                # GUESS: 1 s per strike
      hits:
        - {hit: 143100003, offset: 0.4}
        - {hit: 143100004, offset: 1.4}
        - {hit: 143100005, count: 3, offset: 2.4, interval: 0.2}
        - {hit: 143100006, count: 4, offset: 3.4, interval: 0.15}
        - {hit: 143100007, count: 3, offset: 4.4, interval: 0.2}
        - {hit: 143100008, offset: 5.4}

    skill:                         # Whirling Onslaught: slashes x4 and bullets x4; 3 uses (data)
      lock: 2.0                    # GUESS
      hits:
        - {hit: 143300001, count: 4, offset: 0.5, interval: 0.2, tags: [spin], triggers_mark: true}
        - {hit: 143300002, count: 4, offset: 0.6, interval: 0.2, tags: [shot], triggers_mark: true}

    ult:                           # Thousand Shade Dance x27 and the detonation (text)
      lock: 6.0                    # GUESS
      hits:
        - {hit: 143400001, count: 27, offset: 1.0, interval: 0.15, tags: [shade], triggers_mark: true}
        - {hit: 143400002, offset: 5.2, tags: [shade], triggers_mark: true}

  buffs:
    - {name: enhanced, event: "cast:self:skill", duration: 3, requires: [514310]}

  potentials:
    514301:   # Last Gasp of Gale (pink): a Whirlwind on the next slash; every 0.5 s for 4 s
      procs:
        - {event: "cast:self:skill", hit: 143300003, count: 8, offset: 2.5, interval: 0.5, restart: true, tags: [whirl], triggers_mark: true}
    514302:   # Twin Shadows (pink): 2 Whirlwinds per cast
      procs:
        - {event: "cast:self:skill", hit: 143300003, count: 16, offset: 0.5, interval: 0.25, tags: [whirl], triggers_mark: true}
    514303:   # Storm-Piercing Surge (pink)
      overrides:
        - {index: 0, hit_tags: [shot]}
    514304:   # Wind-Splitting Bullet (pink): 4 more bullets (the first step of holding)
      add_hits:
        skill: [{hit: 143300002, count: 4, offset: 0.7, interval: 0.2, tags: [shot], triggers_mark: true}]
      overrides:
        - {index: 0, hit_tags: [shot]}
    514305:   # Zero Hour: nearby targets
      overrides:
        - {index: 0, hit_tags: []}
    514306:   # Blade's Waltz
      overrides:
        - {index: 1, hit_tags: [spin]}
    514307:   # Rapid Draw
      overrides:
        - {index: 0, event: "hit:self:spin"}
    514308:   # Overheat Shot
      overrides:
        - {index: 0, hit_tags: [shot], event: "cast:self:skill", duration: 1, max_stacks: 3}
    514309:   # Scorching Gale
      overrides:
        - {index: 0, event: "hit:self:shot", icd: 1, reset_on: ["cast:self:skill"]}
    514310:   # Tracewind Blink: GUESS: her autos fire the laser too, though the string above is melee
      procs:
        - {event: "hit:self:auto_dmg", when: "while:status:enhanced", hit: 143300005, icd: 1.0, tags: [laser]}
    514311:   # Unseen Predator
      overrides:
        - {index: 0, event: "dodge:main"}
    514312:   # Dauntless Poise
      overrides:
        - {index: 0, max_stacks: 1, copies: [{event: "while:squad:4:1"}, {event: "while:squad:4:2"}, {event: "while:squad:4:3"}]}
    514313:   # Tempest Stance
      overrides:
        - {index: 0, event: "mark:self"}
    514341: {}   # Daybreaker
    514342:   # Raging Battle Will
      overrides:
        - {index: 0, event: "cast:self:ult"}
    514343: {}   # Tempest Siphon

support:
  untimed: true
  on_field: {skill: 3.0, ult: 6.0}   # GUESS
  mark: {hit: 143000001, tags: [cyclone]}   # text: Rolling Bungee can trigger Ventus Mark
  procs:
    - {event: "mark:self", hit: 143000001, count: 2, offset: 0.1, interval: 0.1, tags: [cyclone]}
  actions:
    skill:                         # Rolling Bungee: slashes x3, then the lasers
      hits:
        - {hit: 143310001, count: 3, offset: 0.8, interval: 0.3, tags: [bungee, slash_s], triggers_mark: true}
        - {hit: 143310002, offset: 2.0, tags: [bungee, laser], triggers_mark: true}
    ult:
      hits:
        - {hit: 143400001, count: 27, offset: 1.0, interval: 0.15, tags: [shade], triggers_mark: true}
        - {hit: 143400002, offset: 5.2, tags: [shade], triggers_mark: true}

  potentials:
    514321:   # Underbarrel Launcher (pink): every 0.5 s for 8 s
      add_hits:
        skill: [{hit: 143310004, count: 16, offset: 2.2, interval: 0.5, tags: [tornado], triggers_mark: true}]
    514322:   # Suppressive Wind-Splitting Round (pink): every 0.5 s for 8 s
      add_hits:
        skill: [{hit: 143310005, count: 16, offset: 1.5, interval: 0.5, tags: [rift], triggers_mark: true}]
    514323:   # Rotary Saw (pink)
      add_hits:
        skill: [{hit: 143310006, offset: 1.8, tags: [bungee, slash_s], triggers_mark: true}]
    514324:   # Enhanced Rapid-Fire Round (pink)
      add_hits:
        skill: [{hit: 143310002, count: 2, offset: 2.3, interval: 0.3, tags: [bungee, laser], triggers_mark: true}]
    514325:   # Ominous Vibe
      procs:
        - {event: "hit:self:bungee", hit: 143310008, chance: 0.5, tags: [vibe], triggers_mark: true}
    514326:   # Hunter's Instinct
      overrides:
        - {index: 0, event: "hit:self:bungee"}
    514327:   # Frost-Proof Constitution
      overrides:
        - {index: 0, event: "cast:self:skill"}
    514328:   # Warrior's Quality
      overrides:
        - {index: 0, hit_tags: [laser], event: "hit:self:slash_s", duration: inf, max_stacks: 9, reset_on: ["cast:self:skill"]}
    514329:   # Will of Vengeance
      overrides:
        - {index: 0, hit_tags: [bungee]}
    514330:   # Dawn's Embrace: one target: the higher value
      overrides:
        - {index: 0, drop: true}
        - {index: 1, hit_tags: [slash_s]}
    514331:   # Expatriate
      overrides:
        - {index: 0, hit_tags: [bungee], event: "while:mark:4"}
    514332:   # Avenger: every 0.5 s for 8 s
      procs:
        - {event: "mark:element4", hit: 143310007, chance: 0.5, icd: 3, count: 16, offset: 0.5, interval: 0.5, tags: [whirlwind]}
    514333:   # Flame Hunter
      overrides:
        - {index: 0, max_stacks: 1, copies: [{event: "while:squad:4:1"}, {event: "while:squad:4:2"}, {event: "while:squad:4:3"}]}
    514341: {}
    514342:
      overrides:
        - {index: 0, event: "cast:self:ult"}
    514343: {}
