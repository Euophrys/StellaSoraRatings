[project]
name = "ssr"
version = "0.1.0"
description = "Stella Sora team ratings"
requires-python = ">=3.13"
dependencies = ["openpyxl", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
